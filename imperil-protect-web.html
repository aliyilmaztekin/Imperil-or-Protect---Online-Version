<html>

         Forcing 100vw/100vh here decouples layout size from drawing size and

      html, body { height: 100%; overflow: hidden; margin: 0; background: rgb(128,128,128); }
      #loadscreen {

        background: rgb(128,128,128); color: #fff; z-index: 9999;
      }
      #loadscreen.hidden { display: none; }

  <div id="loadscreen"><span id="loadtext">Starting&hellip;</span><div id="loadbar"><div></div></div></div>
  <script>
'use strict';

// CONFIG:

// Study images
const SRC_ROOT = 'https://aliyilmaztekin.github.io/Imperil-or-Protect---Online-Version/colorWheelTools/TestObjectsTransparent';
const SRC_EXT  = '.png';

// The condition matrix determines the events. ImageMatrix determines the image names.
const CONDITION_URL = 'https://aliyilmaztekin.github.io/Imperil-or-Protect---Online-Version/condFiles/conditionMatrixTest.json';
const IMAGE_URL     = 'https://aliyilmaztekin.github.io/Imperil-or-Protect---Online-Version/condFiles/imageMatrixTest.json';

/*
 * CHECK THIS BEFORE COLLECTING DATA.
 *
 * The original header comment described the row layout as
 *     rep, context, rep1color, rep2color, novel, theta, probe, pos...
 * but the destructuring below read
 *     rep, context, rep1color, rep2color, novel, probe, pos...
 * i.e. with no theta column. The two disagree by one position, and if the
 * comment is the correct one then every "probe" read was actually a theta,
 * every position was shifted by one, and angularError was scored against the
 * wrong target. Open one row of conditionMatrixTest.json and set this flag to
 * match reality.
 */
const COND_HAS_THETA_COL = false;

const nTrials = 18;
const seriesLength = 6;
const nSeries = nTrials/seriesLength;
const nBlocks = nTrials/seriesLength;
const BLOCK_SIZE = nTrials/nBlocks;

let breaksRemaining = nBlocks-1;   // or whatever drives the decision
const nCols = 3;
const LAB_CACHE  = 12;            // LabStim objects kept resident (~4 MB each)

// Scale the original size of the image
const imageScale = 0.5;

// Color wheel circle
const CIRCLE_R      = 215;
const CIRCLE_LINE_W = 3;
const CIRCLE_COLOR  = 'rgb(0,0,0)';
const WHEEL_MARKER  = true;        // short tick showing the current angle
const MARKER_COLOR  = 'rgb(0,0,0)';
const MARKER_LEN    = 12;          // half-length of the tick, in canvas px

// Cursor angle -> theta.  theta = mod(WHEEL_DIR * screenAngle + WHEEL_OFFSET)
const WHEEL_DIR    = -1;
const WHEEL_OFFSET = 90;

const THETA_MIN = 0;
const N_THETA   = 360;

/*
 * UNUSED. Nothing ever populates trialState.wheelRef, so the wheel_L / wheel_C
 * / wheel_h0 columns were never written. The constants are left here as a
 * reminder that the feature is unimplemented, not as live configuration.
 */
const WHEEL_REF = 'stimulus';
const WHEEL_FIXED_L = 70, WHEEL_FIXED_C = 38, WHEEL_FIXED_H = 0;

const REQUIRE_INSIDE_RING = false;
const RING_INNER = 60, RING_OUTER = 400;

// Event durations (in milliseconds)
const STUDY_MS = 1900, STUDY_STIM_MS = 800;
const TEST_MS  = 4300, TEST_STIM_MS  = 4000;
const ITI_MS   = 300;

// Context colors pre-defined here.
const contextColors = ['rgb(165, 127, 151)', 'rgb(135, 174, 116)'];
const greyBackground = 'rgb(128, 128, 128)';

// The first context in the experiment is chosen here on a coin flip
const startContext = Math.round(Math.random());

// Data saving. Leave SAVE_URL empty to skip the server round trip and rely
// on the CSV download at the end.
const SAVE_URL   = '';            // e.g. 'https://your-server.example/save'
const SAVE_BLOCKS = true;         // POST after every block, not just at the end
const DOWNLOAD_LOCAL_FALLBACK = true;   // write the .xlsx if the POST fails

if (!SAVE_URL) {
  console.warn('SAVE_URL is empty: nothing is posted to a server. ' +
               'Mid-experiment data survives only in localStorage, and the ' +
               'full dataset only via the CSV download at the end.');
}

const params = new URLSearchParams(location.search);
const PARTICIPANT_ID = params.get('PROLIFIC_PID') || params.get('id') || `anon-${Date.now()}`;
const SESSION_ID     = params.get('SESSION_ID') || params.get('session') || '1';

// Conversion functions

const mod = (x, m) => ((x % m) + m) % m;

// theta from a screen angle measured CCW from +x with y pointing up.
const thetaFromAngle = deg => THETA_MIN + mod(Math.round(WHEEL_DIR * deg + WHEEL_OFFSET), N_THETA);

// Exact inverse, used to paint the wheel so the colour under the cursor is
// the colour on screen. Valid because WHEEL_DIR is +/-1.
const angleFromTheta = th => mod(WHEEL_DIR * (th - THETA_MIN - WHEEL_OFFSET), 360);

// Signed circular difference in degrees, in (-180, 180].
const circDiff = (a, b) => mod(a - b + 180, 360) - 180;

/*
 * jspsych-psychophysics sets  canvas.width = canvas_width * devicePixelRatio
 * and then  ctx.scale(dpr, dpr).  So drawing coordinates are CSS pixels while
 * canvas.width is the backing store, dpr times larger. Using canvas.width / 2
 * as the centre overshoots by exactly dpr and throws everything into the
 * bottom-right corner on HiDPI displays.
 *
 * Read the scale off the context instead of assuming devicePixelRatio, so this
 * stays correct if the plugin ever changes its scaling policy.
 */
function drawingBox(canvas, ctx) {
  const t = ctx.getTransform();
  const sx = t.a || 1, sy = t.d || 1;
  const w = canvas.width / sx, h = canvas.height / sy;
  return { w, h, cx: w / 2, cy: h / 2, sx, sy };
}

const loadEl   = document.getElementById('loadscreen');
const loadText = document.getElementById('loadtext');
const loadFill = document.querySelector('#loadbar > div');

function showLoading(text, frac) {
  if (!loadEl) return;
  loadEl.classList.remove('hidden');
  loadText.textContent = text;
  loadFill.style.width = (frac == null ? 0 : Math.round(frac * 100)) + '%';
}
const hideLoading = () => loadEl && loadEl.classList.add('hidden');

// jsonencode in Matlab flattens multi-column matrices into a single column.
// To re-establish the 900x3 structure, reshape the imageMatrix
function reshapeMatrix(matrix, nCols) {
    const nRows = matrix.length / nCols;
    return Array.from({ length: nRows }, (_, r) =>
        Array.from({ length: nCols }, (_, c) => matrix[c * nRows + r])
    );
}

function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

const nKeep = (nBlocks*seriesLength)

function reshapeAndSample(matrix, nCols, nKeep) {
    const rows = reshapeMatrix(matrix, nCols);
    if (nKeep > rows.length) throw new Error(`Only ${rows.length} rows available`);
    return shuffle(rows).slice(0, nKeep);
}

function sizeToViewport(trial) {
  const w = window.innerWidth, h = window.innerHeight;
  trial.canvas_width  = w;
  trial.canvas_height = h;
  if (trial.stimuli?.[0]?.obj_type === 'rect') {
    trial.stimuli[0].width  = w;
    trial.stimuli[0].height = h;
  }
}

/* ==================================================================== *
 *  SOURCE IMAGES + LAB CACHE                                           *
 * ==================================================================== */

const srcFileFor = new Map();     // id -> filename within SRC_ROOT
const srcBitmaps = new Map();     // id -> ImageData (straight alpha)
const labCache   = new Map();     // id -> LabStim  (insertion-ordered LRU)

/*
 * SRC_EXT was declared and then never used, so ids without an extension
 * resolved to a 404. Append it only when the id has no extension of its own.
 */
function srcUrl(id) {
  const file = srcFileFor.get(id) || String(id);
  return `${SRC_ROOT}/${/\.\w{2,4}$/.test(file) ? file : file + SRC_EXT}`;
}

function decodeToImageData(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      // willReadFrequently keeps the readback on the CPU path; srgb stops the
      // browser colour-managing the decode out from under us.
      const ctx = c.getContext('2d', { willReadFrequently: true, colorSpace: 'srgb' });
      ctx.drawImage(img, 0, 0);
      resolve(ctx.getImageData(0, 0, c.width, c.height));
    };
    img.onerror = () => reject(new Error(`Could not load source image: ${url}`));
    img.src = url;
  });
}

// Pre-load all the images in a block
// To be called upon during breaks
async function preloadSources(ids, onProgress) {
  let done = 0;
  const CONCURRENCY = 8;
  let next = 0;
  const worker = async () => {
    while (next < ids.length) {
      const id = ids[next++];
      if (!srcBitmaps.has(id)) srcBitmaps.set(id, await decodeToImageData(srcUrl(id)));
      onProgress(++done, ids.length);
    }
  };
  await Promise.all(Array.from({ length: Math.min(CONCURRENCY, ids.length) }, worker));
}

function getLab(id) {
  let st = labCache.get(id);
  if (st) { labCache.delete(id); labCache.set(id, st); return st; }   // refresh LRU

  const data = srcBitmaps.get(id);
  if (!data) throw new Error(`No source bitmap decoded for "${id}"`);
  st = new LabStim(data.data, data.width, data.height);
  labCache.set(id, st);

  while (labCache.size > LAB_CACHE) {
    const oldest = labCache.keys().next().value;
    labCache.delete(oldest);
  }
  return st;
}

// Image rendering function
const scratchFor = new WeakMap();
const scratchFor2 = new WeakMap();

/*
 * The cache key must be the hue that was actually rendered. Comparing against
 * `theta` while storing `theta + randomRotate` meant the guard never matched,
 * so every frame re-rendered, and one cursor position per trial silently kept
 * a stale frame on screen.
 */
function drawStim(ctx, stim, theta, cx, cy, scale, randomRotate) {
  let s = scratchFor.get(stim);
  if (!s) {
    const c = document.createElement('canvas');
    c.width = stim.width; c.height = stim.height;
    s = { canvas: c, ctx: c.getContext('2d', { colorSpace: 'srgb' }),
          img: new ImageData(stim.out, stim.width, stim.height), hue: null };
    scratchFor.set(stim, s);
  }
  const hue = mod(Number(theta) + Number(randomRotate || 0), 360);
  if (s.hue !== hue) {
    stim.render(hue);
    s.ctx.putImageData(s.img, 0, 0);
    s.hue = hue;
  }
  const w = stim.width * scale, h = stim.height * scale;
  ctx.drawImage(s.canvas, cx - w / 2, cy - h / 2, w, h);
}

function drawStimGrey (ctx, stim, theta, cx, cy, scale){
  let s = scratchFor2.get(stim);
  if (!s) {
    const c = document.createElement('canvas');
    c.width = stim.width; c.height = stim.height;
    s = { canvas: c, ctx: c.getContext('2d', { colorSpace: 'srgb' }),
          img: new ImageData(stim.out, stim.width, stim.height), hue: null };
    scratchFor2.set(stim, s);
  }
  const hue = mod(Number(theta), 360);
  if (s.hue !== hue) {
    stim.render(hue);
    s.ctx.putImageData(s.img, 0, 0);
    s.hue = hue;
  }
  const w = stim.width * scale, h = stim.height * scale;
  ctx.drawImage(s.canvas, cx - w / 2, cy - h / 2, w, h);

}


function drawWheel(ctx, cx, cy, currentTheta) {
  ctx.save();

  ctx.strokeStyle = CIRCLE_COLOR;
  ctx.lineWidth   = CIRCLE_LINE_W;
  ctx.beginPath();
  ctx.arc(cx, cy, CIRCLE_R, 0, 2 * Math.PI);
  ctx.stroke();

  if (WHEEL_MARKER && currentTheta != null && Number.isFinite(Number(currentTheta))) {
    const rad = angleFromTheta(Number(currentTheta)) * Math.PI / 180;
    const ux = Math.cos(rad), uy = -Math.sin(rad);       // y down on canvas
    ctx.strokeStyle = MARKER_COLOR;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx + ux * (CIRCLE_R - MARKER_LEN), cy + uy * (CIRCLE_R - MARKER_LEN));
    ctx.lineTo(cx + ux * (CIRCLE_R + MARKER_LEN), cy + uy * (CIRCLE_R + MARKER_LEN));
    ctx.stroke();
  }

  ctx.restore();
}


// Dynamically track where the mouse is to rotate the color of the probe object

const wheel = {
  angle: null, radius: null,
  theta: null,          // cursor position in wheel space
  clickTheta: null,     // theta frozen at the moment of the click
  randomRotation: 0,    // per-trial offset between wheel space and hue
  targetHue: null,
  cx: null, cy: null,   // drawing-unit centre, for the click cross-check
  stim: null, detach: null,

  // Timing. t0 is set when the tracker attaches, i.e. at test-canvas onset.
  // firstMove and clickTime are absolute performance.now() stamps; the
  // differences are what get logged.
  t0: null, firstMove: null, clickTime: null
};

function attachTracker() {
  // A previous trial that ended abnormally can leave its listeners bound.
  if (wheel.detach) { wheel.detach(); wheel.detach = null; }

  wheel.t0        = performance.now();
  wheel.firstMove = null;
  wheel.clickTime = null;

  const canvas = document.querySelector('canvas');
  if (!canvas) { console.warn('attachTracker: no canvas found'); return; }

  const g = drawingBox(canvas, canvas.getContext('2d'));
  const box = canvas.getBoundingClientRect();

  // client px -> drawing units. One uniform factor, not separate x and y:
  // a non-uniform scale would distort the cursor angle and therefore the hue.
  const k = g.w / box.width;
  if (Math.abs(k - g.h / box.height) > 0.01) {
    console.warn('Canvas layout aspect differs from its drawing aspect; ' +
                 'cursor angles will be skewed. Check the canvas CSS.');
  }

  const cx = box.left + box.width / 2, cy = box.top + box.height / 2;

  // Centre in drawing units, so on_finish can convert click_x / click_y
  // (which are canvas-relative, not centre-relative) into an angle.
  wheel.cx = g.cx;
  wheel.cy = g.cy;

  function onMove(e) {
    // Stamped before the ring guard, so move onset means the first physical
    // movement, not the first movement that happened to land in the annulus.
    if (wheel.firstMove == null) wheel.firstMove = performance.now();

    const x =  (e.clientX - cx) * k;
    const y = -(e.clientY - cy) * k;
    wheel.radius = Math.hypot(x, y);
    wheel.angle  = mod(Math.atan2(y, x) * 180 / Math.PI, 360);
    if (REQUIRE_INSIDE_RING && (wheel.radius < RING_INNER || wheel.radius > RING_OUTER)) return;
    wheel.theta = thetaFromAngle(wheel.angle);
  }

  // Freeze the response at the instant of the click. wheel.theta is what
  // actually drove the rendered hue, so it is the response, not a
  // reconstruction from click coordinates.
  function onDown(e) {
    onMove(e);
    wheel.clickTheta = wheel.theta;
    wheel.clickTime  = performance.now();
  }

  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerdown', onDown);
  wheel.detach = () => {
    canvas.removeEventListener('pointermove', onMove);
    canvas.removeEventListener('pointerdown', onDown);
  };
}

/* ==================================================================== *
 *  DATA SAVING                                                         *
 * ==================================================================== */

let savedRows = 0;

/*
 * INDEPENDENT TRIAL LOG.
 *
 * jsPsych 8.3.0 + psychophysics 5.1.0 were dropping keys between the plugin's
 * trial_data and the stored row: response_type and key_press came out blank
 * even though the plugin writes them unconditionally and response_type has a
 * hard default of "key". Anything added via the trial-level `data` parameter
 * or in on_finish went the same way, while rt survived.
 *
 * Rather than depend on that pipeline for the dependent variables, every test
 * trial appends a fully-formed row here. This array is the source of truth for
 * the analysis file; jsPsych's own CSV is still written alongside it as a
 * secondary record.
 *
 * Note on empty cells in the jsPsych CSV: its writer maps `undefined` to an
 * empty string and `null` to the text "null", and it builds columns from the
 * union of keys across all rows. So a header with an entirely blank column
 * means the key exists somewhere but is undefined, not that it is null.
 */
const trialRows = [];

// Fixed column order, so the CSV is stable even if a trial errors early.
const ROW_COLUMNS = [
  'participant_id', 'session', 'timestamp',
  'block', 'trialCount', 'trial_index',
  'rep', 'cond_context', 'context_color', 'cond_theta',
  'probe', 'probe_stim', 'stim_names', 'study_colors',
  'target_hue', 'rotation', 'target_theta',
  'raw_angle', 'adjusted_angle', 'response_hue',
  'angular_error', 'abs_angular_error',
  'responded', 'timed_out',
  'rt', 'move_onset', 'click_rt', 'movement_time',
  'cursor_angle', 'cursor_radius',
  'click_x', 'click_y', 'click_theta', 'click_radius',
  'screen_w', 'screen_h', 'dpr'
];

/*
 * Cell typing for the xlsx writer.
 *
 * A CSV carries no type information, so Excel guesses from the text and from
 * your system locale. On a tr-TR Mac the decimal separator is a comma, which
 * is why the delimiter has to be set by hand and why anything shaped like
 * 2.1.0 or 3-5 comes back as a date. Writing an xlsx removes the guessing:
 * numbers are stored as numbers.
 */
const TEXT_COLUMNS = new Set([
  'participant_id', 'session', 'timestamp', 'context_color',
  'probe_stim', 'stim_names', 'study_colors'
]);

const BOOL_COLUMNS = new Set(['responded', 'timed_out']);

// performance.now() differences carry ~10 meaningless decimals. Round at the
// point of writing rather than leaving 1431.2999999999997 in the sheet.
const DECIMALS = {
  rt: 1, move_onset: 1, click_rt: 1, movement_time: 1,
  angular_error: 2, abs_angular_error: 2,
  raw_angle: 2, adjusted_angle: 2, response_hue: 2,
  target_hue: 2, target_theta: 2,
  cursor_angle: 2, cursor_radius: 1,
  click_x: 1, click_y: 1, click_theta: 2, click_radius: 1,
  dpr: 2
};

// null becomes a genuinely empty cell, which reads as NA in R and as NaN in
// pandas. The string "null" would read as text and poison the column's type.
function cellValue(col, v) {
  if (v === null || v === undefined || v === '') return null;
  if (BOOL_COLUMNS.has(col)) return Boolean(v);
  if (TEXT_COLUMNS.has(col)) return String(v);
  const n = Number(v);
  if (!Number.isFinite(n)) return String(v);
  const d = DECIMALS[col];
  return d == null ? n : Number(n.toFixed(d));
}

function buildWorkbook(jsPsych) {
  const wb = XLSX.utils.book_new();

  // Sheet 1: the analysis rows, one per test trial.
  const aoa = [ROW_COLUMNS.slice()];
  for (const r of trialRows) aoa.push(ROW_COLUMNS.map(c => cellValue(c, r[c])));
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = ROW_COLUMNS.map(c => ({ wch: Math.max(11, c.length + 2) }));
  XLSX.utils.book_append_sheet(wb, ws, 'trials');

  // Sheet 2: session-level facts that would otherwise be repeated on every
  // row. The user agent in particular is long and full of commas.
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
    ['field', 'value'],
    ['participant_id', PARTICIPANT_ID],
    ['session', SESSION_ID],
    ['start_context', Number(startContext)],
    ['n_trials_logged', trialRows.length],
    ['n_trials_expected', nTrials],
    ['screen_w', window.innerWidth],
    ['screen_h', window.innerHeight],
    ['dpr', window.devicePixelRatio || 1],
    ['saved_at', new Date().toISOString()],
    ['user_agent', navigator.userAgent]
  ]), 'session');

  // Sheet 3: jsPsych's own record, every cell written as text so nothing gets
  // reinterpreted. Kept for auditing, not for analysis.
  try {
    const raw = jsPsych.data.get().values();
    const cols = [...new Set(raw.flatMap(r => Object.keys(r)))];
    const rawAoa = [cols];
    for (const r of raw) {
      rawAoa.push(cols.map(c => {
        const v = r[c];
        if (v === null || v === undefined) return null;
        return typeof v === 'object' ? JSON.stringify(v) : String(v);
      }));
    }
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rawAoa), 'jspsych_raw');
  } catch (e) {
    console.warn('raw sheet skipped:', e);
  }

  return wb;
}

// Quote every field and flatten newlines. Only used if SheetJS is unavailable.
function toCsv(rows, columns) {
  const esc = v => (v === null || v === undefined)
    ? '""'
    : '"' + String(v).replace(/\r?\n/g, ' ').replace(/"/g, '""') + '"';
  const lines = [columns.map(esc).join(',')];
  for (const r of rows) lines.push(columns.map(c => esc(r[c])).join(','));
  return lines.join('\r\n') + '\r\n';
}

function downloadText(text, filename, mime) {
  try {
    const blob = new Blob([text], { type: mime });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch (e) {
    console.error(`download of ${filename} failed:`, e);
  }
}

async function postRows(rows, tag) {
  if (!SAVE_URL || !rows.length) return { ok: false, skipped: true };
  const body = JSON.stringify({
    participant_id: PARTICIPANT_ID, session: SESSION_ID, tag,
    sent_at: new Date().toISOString(), rows
  });
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      const res = await fetch(SAVE_URL, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body, keepalive: body.length < 60000
      });
      if (res.ok) return { ok: true };
      console.warn(`save "${tag}" HTTP ${res.status} (attempt ${attempt + 1})`);
    } catch (e) {
      console.warn(`save "${tag}" failed (attempt ${attempt + 1}):`, e.message);
    }
    await new Promise(r => setTimeout(r, 500 * (attempt + 1)));
  }
  return { ok: false };
}

// Ships only rows not sent yet, so a dropout still leaves everything up to
// the last completed block on the server.
async function saveIncremental(tag) {
  const fresh = trialRows.slice(savedRows);
  if (!fresh.length) return;
  const res = await postRows(fresh, tag);
  if (res.ok) savedRows = trialRows.length;
}

/*
 * Writes one .xlsx with three sheets. Falls back to the CSV only if SheetJS
 * failed to load or the write threw, because a participant finishing with no
 * file at all is the one outcome worth avoiding.
 */
function saveDataFile(jsPsych) {
  const stamp = `${PARTICIPANT_ID}_s${SESSION_ID}_${Date.now()}`;

  if (typeof XLSX === 'undefined') {
    console.warn('SheetJS did not load; writing CSV instead.');
    downloadText(toCsv(trialRows, ROW_COLUMNS), `${stamp}_trials.csv`, 'text/csv');
    return;
  }
  try {
    XLSX.writeFile(buildWorkbook(jsPsych), `${stamp}.xlsx`, { compression: true });
  } catch (e) {
    console.error('xlsx write failed; writing CSV instead:', e);
    downloadText(toCsv(trialRows, ROW_COLUMNS), `${stamp}_trials.csv`, 'text/csv');
  }
}

// EXPERIMENT SCRIPT

async function runExperiment() {

  // Save data at the end of the experiment
  const jsPsych = initJsPsych({
    on_finish: async function () {
      showLoading('Saving your data\u2026');
      const res = await postRows(trialRows, 'final');
      // The analysis CSV is written whether or not the POST succeeded: a
      // server copy and a local copy are not redundant when one of them is a
      // server you have not configured yet.
      if (!res.ok && DOWNLOAD_LOCAL_FALLBACK) saveDataFile(jsPsych);
      console.log(`session complete: ${trialRows.length} test rows`, trialRows);
      showLoading('Done. Thank you for your participation.');
    }
  });

  // Save data at the beginning of each trial
  jsPsych.data.addProperties({
    participant_id: PARTICIPANT_ID,
    session: SESSION_ID,
    start_context: startContext,
    screen_w: window.innerWidth,
    screen_h: window.innerHeight,
    dpr: window.devicePixelRatio || 1,
    ua: navigator.userAgent
  });

  // Fetch conditionMatrix and imageMatrix & await until unpacked.
  showLoading('Loading condition files\u2026');
  const [conditionMatrix, flatImageMatrix] = await Promise.all([
    fetch(CONDITION_URL).then(r => r.json()),
    fetch(IMAGE_URL).then(r => r.json())
  ]);

  /*
   * The condition matrix comes out of MATLAB's jsonencode as a bare array of
   * rows, so the first trial lives at index 0. The previous hard-coded
   * `startRow = 1` skipped it: trial 1 was served row 2's rep/context/probe,
   * trial 2 got row 3's, and so on for the whole session. That is the source
   * of the 2,3,4,5,6,1 cycle in the rep column instead of 1,2,3,4,5,6.
   *
   * MATLAB uses 1-based indexing and JavaScript does not, but that difference
   * lives entirely on the MATLAB side of the export; once the array is here,
   * row 0 is the first trial. No compensating offset belongs in this file.
   *
   * Detect a header rather than assuming one, so this cannot drift again if
   * the export format changes: a data row is entirely numeric.
   */
  const isNumericCell = v =>
    typeof v === 'number' ? Number.isFinite(v)
    : typeof v === 'string' && v.trim() !== '' && Number.isFinite(Number(v));

  const looksLikeData = row => Array.isArray(row) && row.length > 0 && row.every(isNumericCell);

  const startRow = looksLikeData(conditionMatrix[0]) ? 0 : 1;
  if (startRow === 1) {
    console.warn('conditionMatrix: first row is not fully numeric, treating it as a header:',
                 conditionMatrix[0]);
  }
  if (conditionMatrix.length - startRow < nTrials) {
    throw new Error(`conditionMatrix has ${conditionMatrix.length - startRow} usable rows, ` +
                    `need ${nTrials}`);
  }
  console.log('conditionMatrix: first trial row =', conditionMatrix[startRow]);

  // Unfold the flattened matrix
  const imageMatrix = reshapeAndSample(flatImageMatrix, nCols, nTrials);

  // Extract the contents of the condition matrix
  const timelineVars = conditionMatrix.slice(startRow, startRow+nTrials).map((row, i) => {

    // Drop the theta column before destructuring if the file has one, so the
    // names below always line up with the values.
    const cols = COND_HAS_THETA_COL ? row.slice(0, 5).concat(row.slice(6)) : row;
    const condTheta = COND_HAS_THETA_COL ? row[5] : null;

    const [rep, context, rep1color, rep2color, novel, probe,
            pos1x, pos1y, pos2x, pos2y, pos3x, pos3y, stimID1, stimID2, stimID3] = cols;

    // Also get the stimulus names
    const [rep1, rep2, novelStim] = imageMatrix[i];

    return {
        block: Math.floor(i / BLOCK_SIZE) + 1,
        rep, context,
        condTheta,
        colors: [rep1color, rep2color, novel],
        probe,
        positions: [
        { x: pos1x, y: pos1y },
        { x: pos2x, y: pos2y },
        { x: pos3x, y: pos3y },
        ],
        trialCount: i + 1,
        stimNames: [rep1, rep2, novelStim],
        stimIDs: [stimID1, stimID2, stimID3],
    };
    });

  const allIds = [...new Set(timelineVars.flatMap(v => v.stimNames))];
  // Preload all the images in the stimulus pool, show loading progress on screen & await until done

  showLoading('Loading stimuli\u2026', 0);
  await preloadSources(allIds, (n, total) => {
    showLoading(`Loading stimuli\u2026 ${n}/${total}`, n / total);
  });

  // Chop the entire events list into blocks.
  const blocks = [];
  for (let i = 0; i < timelineVars.length; i += BLOCK_SIZE) {
    blocks.push(timelineVars.slice(i, i + BLOCK_SIZE));
  }


  // This is important. We convert the colors of all the images within a given block beforehand for speed.
  // Thus, the rotated variants of each study image is precomputed for the color wheel at the start of each block.
  function blockPrep(k) {
    return {
      type: jsPsychCallFunction,
      async: true,
      func: function (done) {
        const ids = [...new Set(blocks[k].flatMap(v => v.stimNames))];
        showLoading(`Preparing block ${k + 1} of ${nBlocks}\u2026`, 0);
        let n = 0;
        const step = () => {
          if (n < ids.length) {
            getLab(ids[n++]);
            showLoading(`Preparing block ${k + 1} of ${nBlocks}\u2026`, n / ids.length);
            setTimeout(step, 0);              // yield so the bar actually paints
          } else {
            hideLoading();
            done();
          }
        };
        step();
      }
    };
  }

  function blockSave(k) {
  return {
    type: jsPsychCallFunction,
    async: true,
    func: function (done) {
      done();                                  // never block the participant
      try {
        localStorage.setItem(
          `ipw_${PARTICIPANT_ID}_s${SESSION_ID}`,
          JSON.stringify({ savedAt: Date.now(), block: k + 1, rows: trialRows })
        );
      } catch (e) {
        console.warn('local backup failed:', e);   // quota / private mode
      }
      console.log(`block ${k + 1} complete: ${trialRows.length} test rows logged`);
      if (SAVE_BLOCKS) saveIncremental(`block${k + 1}`).catch(console.warn);
    }
  };
}

  /*
   * Plain object, not an arrow function. Assigning properties onto a function
   * happens to work, but it made the declared shape a lie and hid the fact
   * that probeName and wheelRef were never populated.
   */
  const trialState = {
    stims: null, pos: null, colors: null, context: null,
    probeName: null, stimNames: null, studyColors: null
  };

const study = {
  type: jsPsychPsychophysics,
  canvas_width: window.innerWidth,
  canvas_height: window.innerHeight,
  background_color: greyBackground,
  origin_center: false,

  stimuli: [
    // Background — fill_color gets overwritten in on_start
    { obj_type: 'rect', width: window.innerWidth, height: window.innerHeight,
      fill_color: greyBackground, show_start_time: 0 },

    { obj_type: 'manual', show_start_time: 0, show_end_time: STUDY_STIM_MS,
      drawFunc: function (s, canvas, ctx) {
        const { cx, cy } = drawingBox(canvas, ctx);
        for (let item = 0; item < 3; item++) {
          drawStim(ctx, trialState.stims[item], trialState.colors[item],
                   cx + trialState.pos[item].x,
                   cy + trialState.pos[item].y, imageScale, 0);
        }
      }
    }
  ],
  choices: 'NO_KEYS',
  trial_duration: STUDY_MS,

  data: {
    trial_part: 'study',
    block:      jsPsych.timelineVariable('block'),
    trialCount: jsPsych.timelineVariable('trialCount'),
  },


  on_start: function (trial) {
    sizeToViewport(trial);
    const trialCount = jsPsych.evaluateTimelineVariable('trialCount');

    // Was previously referenced but never declared here, which threw a
    // ReferenceError at the bottom of this function.
    const allItems = jsPsych.evaluateTimelineVariable('stimNames');

    let curContextColor;                      // declared once, in function scope
    if (trialCount == 1) {
      curContextColor = contextColors[Number(startContext)];
    } else {
      const cmd = jsPsych.evaluateTimelineVariable('context');
      if (Number(cmd) == 1) {
        if (Number(startContext == 0)) {
          curContextColor = contextColors[1];
        } else if (Number(startContext == 1)) {
          curContextColor = contextColors[0];
        }  
      } else {
        curContextColor = curContextColor;
      }
    }

    trialState.context = curContextColor;
    trial.stimuli[0].fill_color = curContextColor;   // <-- the actual update

    trialState.stims  = allItems.map(getLab);
    trialState.pos    = jsPsych.evaluateTimelineVariable('positions');
    trialState.colors = jsPsych.evaluateTimelineVariable('colors');

    trialState.stimNames   = allItems.join('|');
    trialState.studyColors = trialState.colors.join('|');
  },

  /*
   * Everything else that used to be written here now goes on the test row.
   * blockSave and saveIncremental both filter to trial_part === 'test', so
   * anything attached to a study row was collected and then thrown away.
   */
  on_finish: function (data) {
    data.context_color = trialState.context;
  }
};

  // Testing stage
  const test = {
    type: jsPsychPsychophysics,
    canvas_width: window.innerWidth,
    canvas_height: window.innerHeight,
    background_color: greyBackground,
    origin_center: false,

    stimuli: [
      // Background — fill_color gets overwritten in on_start
    { obj_type: 'rect', width: window.innerWidth, height: window.innerHeight,
      fill_color: greyBackground, show_start_time: 0 },
      {
        obj_type: 'manual',
        show_start_time: 0,
        show_end_time: TEST_STIM_MS, // Maximum allowed test duration

        drawFunc: function (s, canvas, ctx) {
          const { cx, cy } = drawingBox(canvas, ctx);
          if (!wheel.stim) return;

          // Before the cursor has moved, theta is null: draw the ring with no
          // marker and the un-rotated stimulus. Exactly one of the two
          // branches runs, so the pre-response frame is not overpainted.
          if (wheel.theta == null) {
            drawWheel(ctx, cx, cy, null);
            drawStimGrey(ctx, wheel.stim, 0, cx, cy, imageScale);
          } else {
            drawWheel(ctx, cx, cy, wheel.theta);
            drawStim(ctx, wheel.stim, wheel.theta, cx, cy, imageScale, wheel.randomRotation);
          }
        }
      }
    ],
    response_type: 'mouse', // Allow a mouse click to end testing
    response_start_time: 0,
    trial_duration: TEST_MS,

    data: {
      trial_part: 'test',
      block:        jsPsych.timelineVariable('block'),
      trialCount:   jsPsych.timelineVariable('trialCount'),
      rep:          jsPsych.timelineVariable('rep'),
      cond_context: jsPsych.timelineVariable('context'),
      probe:        jsPsych.timelineVariable('probe'),
      cond_theta:   jsPsych.timelineVariable('condTheta'),
    },

    on_start: function (trial) {
      sizeToViewport(trial);
      const allItems = jsPsych.evaluateTimelineVariable('stimNames');
      const probeStimIndex = jsPsych.evaluateTimelineVariable('probe');
      const probeStimName = allItems[Number(probeStimIndex-1)];

      // Was read in on_finish but never assigned, so probe_stim was undefined.
      trialState.probeName = probeStimName;

      /*
       * Read the timeline variables here and keep them, instead of relying on
       * the trial-level `data` parameter, which is where block / trialCount /
       * trial_part were being lost. evaluateTimelineVariable demonstrably
       * works in on_start: it is what already drives the context colour and
       * the stimulus selection.
       */
      trialState.block       = jsPsych.evaluateTimelineVariable('block');
      trialState.trialCount  = jsPsych.evaluateTimelineVariable('trialCount');
      trialState.rep         = jsPsych.evaluateTimelineVariable('rep');
      trialState.condContext = jsPsych.evaluateTimelineVariable('context');
      trialState.condTheta   = jsPsych.evaluateTimelineVariable('condTheta');
      trialState.probeIndex  = probeStimIndex;

      const randomRotation = () =>
          jsPsych.randomization.sampleWithoutReplacement([45, 90, 135, 180, 225, 270, 315], 1)[0];
      wheel.randomRotation = randomRotation();

      wheel.targetHue = Number(trialState.colors[Number(probeStimIndex - 1)]);
      trial.stimuli[0].fill_color = trialState.context;

      wheel.stim       = getLab(probeStimName);

      wheel.angle      = null;
      wheel.radius     = null;
      wheel.theta      = null;
      wheel.clickTheta = null;
      wheel.t0         = null;
      wheel.firstMove  = null;
      wheel.clickTime  = null;
    },

    on_load: function () { attachTracker(); },

    on_finish: function (data) {
      if (wheel.detach) { wheel.detach(); wheel.detach = null; }

      data.event = 'test';

      /*
       * Hue and wheel angle live in two spaces separated by the per-trial
       * offset R:
       *
       *     displayed hue = mod(theta + R, 360)          (see drawStim)
       *
       * so the reported hue is the clicked theta plus R, and the position the
       * participant should have clicked is mod(targetHue - R, 360).
       * WHEEL_OFFSET is already consumed inside thetaFromAngle, so it must not
       * appear again here.
       */
      const R = Number(wheel.randomRotation) || 0;

      /*
       * Only treat this as a response if a click actually happened. Falling
       * back to wheel.theta unconditionally meant a timed-out trial in which
       * the participant merely moved the mouse was scored as a response, at
       * whatever angle the cursor happened to be resting.
       *
       * data.click_x is set by the plugin, so it is an independent witness to
       * the click; wheel.clickTheta is preferred because it is the value that
       * actually drove the rendered hue.
       */
      const pluginClicked = data.click_x != null;
      const respTheta = (wheel.clickTheta != null) ? wheel.clickTheta
                      : (pluginClicked ? wheel.theta : null);

      data.rotation      = R;
      data.rawAngle      = (respTheta == null) ? null : mod(respTheta, 360);
      data.adjustedAngle = (respTheta == null) ? null : mod(respTheta + R, 360);

      data.response_hue  = data.adjustedAngle;                  // hue reported
      data.target_hue    = wheel.targetHue;                     // hue at study
      data.target_theta  = mod(wheel.targetHue - R, 360);       // correct click position

      data.cursor_angle  = wheel.angle;
      data.cursor_radius = wheel.radius;
      data.responded     = respTheta != null;
      data.timed_out     = !data.responded;

      // Accuracy
      data.angularError    = data.responded
        ? circDiff(data.response_hue, wheel.targetHue)
        : null;
      data.absAngularError = data.angularError == null ? null : Math.abs(data.angularError);

      /*
       * Timing. Three separate quantities, all relative to tracker attachment
       * (i.e. test-canvas onset). data.rt from the plugin is a fourth,
       * independent estimate on its own clock; keep it and cross-check.
       */
      data.move_onset    = wheel.firstMove == null ? null : wheel.firstMove - wheel.t0;
      data.click_rt      = wheel.clickTime == null ? null : wheel.clickTime - wheel.t0;
      data.movement_time = (wheel.firstMove == null || wheel.clickTime == null)
                         ? null : wheel.clickTime - wheel.firstMove;

      // Trial identity, moved here from study.on_finish so it survives the
      // trial_part === 'test' filter in blockSave / saveIncremental.
      data.context_color = trialState.context;
      data.probe_stim    = trialState.probeName;
      data.stim_names    = trialState.stimNames;
      data.study_colors  = trialState.studyColors;

      /*
       * Independent cross-check from the click coordinates.
       *
       * psychophysics 5.1.0 writes
       *     click_x: response.clickX - centerX
       * so click_x / click_y are ALREADY centre-relative. Subtracting
       * wheel.cx / wheel.cy again, as the previous version did, displaced
       * every click by one canvas centre and made click_theta meaningless.
       * Use them as they come.
       */
      if (data.click_x != null) {
        const x =  data.click_x;
        const y = -data.click_y;                 // canvas y grows downward
        data.click_theta  = thetaFromAngle(mod(Math.atan2(y, x) * 180 / Math.PI, 360));
        data.click_radius = Math.hypot(x, y);
      } else {
        data.click_theta  = null;
        data.click_radius = null;
      }

      /*
       * Append the analysis row. Everything here is read from trialState and
       * wheel, both of which are ordinary module-level objects, so nothing on
       * this row can be lost by jsPsych's result handling.
       */
      trialRows.push({
        participant_id: PARTICIPANT_ID,
        session:        SESSION_ID,
        timestamp:      new Date().toISOString(),

        block:        trialState.block,
        trialCount:   trialState.trialCount,
        trial_index:  data.trial_index,

        rep:           trialState.rep,
        cond_context:  trialState.condContext,
        context_color: trialState.context,
        cond_theta:    trialState.condTheta,

        probe:        trialState.probeIndex,
        probe_stim:   trialState.probeName,
        stim_names:   trialState.stimNames,
        study_colors: trialState.studyColors,

        target_hue:   wheel.targetHue,
        rotation:     R,
        target_theta: data.target_theta,

        raw_angle:      data.rawAngle,
        adjusted_angle: data.adjustedAngle,
        response_hue:   data.response_hue,

        angular_error:     data.angularError,
        abs_angular_error: data.absAngularError,

        responded: data.responded,
        timed_out: data.timed_out,

        rt:            data.rt,              // the plugin's own clock
        move_onset:    data.move_onset,
        click_rt:      data.click_rt,
        movement_time: data.movement_time,

        cursor_angle:  wheel.angle,
        cursor_radius: wheel.radius,

        click_x:      data.click_x,
        click_y:      data.click_y,
        click_theta:  data.click_theta,
        click_radius: data.click_radius,

        screen_w: window.innerWidth,
        screen_h: window.innerHeight,
        dpr:      window.devicePixelRatio || 1
      });

      wheel.theta      = null;
      wheel.clickTheta = null;
    }
  };

  // Inter-Trial Interval
const iti = {
  type: jsPsychPsychophysics,
  canvas_width: window.innerWidth,
  canvas_height: window.innerHeight,
  background_color: greyBackground,
  stimuli: [{
    obj_type: 'rect', width: window.innerWidth, height: window.innerHeight,
    fill_color: greyBackground, show_start_time: 0
  }],
  choices: 'NO_KEYS',
  trial_duration: ITI_MS,
  data: { trial_part: 'iti' },
  on_start: function (trial) {
    sizeToViewport(trial);
  }
};

  /* ---- timeline ---- */

  const timeline = [];

  // Ask the person to switch to fullscreen
  timeline.push({
    type: jsPsychFullscreen,
    fullscreen_mode: true,
    message: '<p style="font-family:sans-serif">The experiment will switch to full screen.</p>',
    button_label: 'Begin'
  });


  // Experiment intructions
  timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `<div style="font-family:sans-serif;max-width:640px;margin:auto;text-align:left">
      <h2>Instructions</h2>
      <p><b>WARNING:</b>This is a demo of the experiment</p>
      <p>On each trial you will briefly see three objects. Try to remember the
         colour of each one.</p>
      <p>Then one object will reappear in the centre of a colour ring. Move the
         mouse around the ring to change its colour, and <b>click</b> when it
         matches the colour you saw.</p>
      <p>Press any key to start.</p></div>`,
    on_finish: () => hideLoading()
  });


const BREAK_SECONDS = 120;   // 2 minutes
let breakTimerId = null;

function startCountdown(seconds, display) {
  const endTime = Date.now() + seconds * 1000;

  const render = () => {
    const remaining = Math.max(0, Math.round((endTime - Date.now()) / 1000));
    const m = String(Math.floor(remaining / 60)).padStart(2, '0');
    const s = String(remaining % 60).padStart(2, '0');
    if (display) display.textContent = `${m}:${s}`;
  };

  render();                                  // paint immediately, no blank first second
  return setInterval(render, 250);           // sub-second ticks so it never looks stalled
}

const breakTrial = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `<div style="font-family:sans-serif;max-width:640px;margin:auto;text-align:left">
    <h2>Break</h2>
    <p>Please take a break.</p>
    <p>Time remaining: <span id="break-timer" style="font-variant-numeric:tabular-nums">--:--</span></p>
    <p>When ready to continue, press any key.</p></div>`,
  choices: 'ALL_KEYS',
  trial_duration: BREAK_SECONDS * 1000,
  on_load: () => {
    document.body.style.backgroundColor = 'rgb(128,128,128)';
    breakTimerId = startCountdown(BREAK_SECONDS, document.querySelector('#break-timer'));
  },
  on_finish: () => {
    document.body.style.backgroundColor = '';
    clearInterval(breakTimerId);
    breakTimerId = null;
    hideLoading();
  }
};

  // Schedule block-wide events:
  // 1) Prepare the stimuli.
  // 2) Play out the actual trials.
  // 3) Save this block's data.
  blocks.forEach((vars, k) => {
    timeline.push(blockPrep(k));
    if (k > 0) {
      timeline.push(breakTrial);
    };
    timeline.push({ timeline: [study, test, iti], timeline_variables: vars });
    timeline.push(blockSave(k));
  });

  timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `<div style="font-family:sans-serif;text-align:center">
      <h2>Finished</h2><p>Press any key to save your data.</p></div>`,
    choices: 'ALL_KEYS'
  });


  hideLoading();
  await jsPsych.run(timeline);
}

runExperiment().catch(err => {
  console.error(err);
  showLoading('Setup failed: ' + err.message);
});

  </script>
