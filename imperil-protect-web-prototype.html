<!DOCTYPE html>
<html>
  <head>
    <title>Imperil-Protect-Web-Prototype</title>
    <script src="https://unpkg.com/jspsych@8.3.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.2.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-image-keyboard-response@2.2.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-preload@2.1.0"></script>
    <script src="jspsych-psychophysics-v.5.1.0/jspsych-psychophysics.js"></script>
    <link href="https://unpkg.com/jspsych@8.3.0/css/jspsych.css" rel="stylesheet" type="text/css" />
    <style>
       canvas { display: block; width: 100vw !important; height: 100vh !important; }
        html, body { height: 100%; overflow: hidden; }
    </style>
  </head>
  <body>
  <script>

  async function runExperiment() {

    const thetas = await fetch('thetas.json').then(r => r.json());

    const jsPsych = initJsPsych();
    const timeline = [];

    const images = [
        'stims/obj1-resized.png',
        'stims/obj3-resized.png',
        'stims/deg156.png'
    ];

    const prepare = {
        type: jsPsychPreload,
        images: images
    };
    timeline.push(prepare);

    function radToCoord(radius, degrees) {
        const rad = degrees * Math.PI / 180;
        return {
            x: radius * Math.cos(rad),
            y: -radius * Math.sin(rad)
        };
    }

    const theta = thetas[1];          

    const radius = 225;
    const pos1 = radToCoord(radius, theta + 0);
    const pos2 = radToCoord(radius, theta + 120);
    const pos3 = radToCoord(radius, theta + 240);

    const commands = [
        {stimulus: 'stims/obj4-resized.png', context: 'rgb(165, 127, 151)', probe: 'stims/obj1-resized.png', theta: 120},
        {stimulus: 'stims/obj5-resized.png', context: 'rgb(165, 127, 151)', probe: 'stims/obj1-resized.png', theta: 240},
        {stimulus: 'stims/obj6-resized.png', context: 'rgb(165, 127, 151)', probe: 'stims/obj3-resized.png', theta: 300},
        {stimulus: 'stims/obj7-resized.png', context: 'rgb(165, 127, 151)', probe: 'stims/obj3-resized.png', theta: 120},
        {stimulus: 'stims/obj8-resized.png', context: 'rgb(135, 174, 116)', probe: 'stims/obj4-resized.png', theta: 60},
        {stimulus: 'stims/obj9-resized.png', context: 'rgb(165, 127, 151)', probe: 'stims/obj4-resized.png', theta: 90}
    ];

    const study = {
        type: jsPsychPsychophysics,
        stimuli: [
            {
                obj_type: 'rect',
                width: window.innerWidth,
                height: window.innerHeight,
                fill_color: function() { return jsPsych.evaluateTimelineVariable('context'); },
                show_start_time: 0
            
            },
            {
                obj_type: 'image',
                file: images[2],
                startX: pos1.x,
                startY: pos1.y,
                scale: 0.5,
                show_start_time: 0,
                show_end_time: 800
            },
            {
                obj_type: 'image',
                file: images[1],
                startX: pos2.x,
                startY: pos2.y,
                scale: 0.5,
                show_start_time: 0,
                show_end_time: 800
            },
            {
                obj_type: 'image',
                file: function() { return jsPsych.evaluateTimelineVariable('stimulus'); },
                startX: pos3.x,
                startY: pos3.y,
                scale: 0.5,
                show_start_time: 0,
                show_end_time: 800
            }
        ],
        choices: "NO_KEYS",
        trial_duration: 1900
    };

   const test = {
    type: jsPsychPsychophysics,
    canvas_width: window.innerWidth,
    canvas_height: window.innerHeight,
    stimuli: [
        {
            obj_type: 'rect',
            width: window.innerWidth,
            height: window.innerHeight,
            fill_color: function() { return jsPsych.evaluateTimelineVariable('context'); },
            show_start_time: 0
        },
        {
            obj_type: "circle",
            radius: 200,
            line_color: "black",
            show_start_time: 0,
            show_end_time: 4000
        },
        {
            // test item
            obj_type: "image",
            file: function() { return jsPsych.evaluateTimelineVariable('probe'); },
            scale: 0.5,
            show_start_time: 0,
            show_end_time: 4000
        }
    ],
    response_type: 'mouse',
    response_start_time: 0,
    trial_duration: 4300,

    on_load: function() {
        const canvas = document.querySelector('canvas');
        const box = canvas.getBoundingClientRect();
        const cx = box.left + box.width / 2;
        const cy = box.top + box.height / 2;

        // live values, read by on_finish
        window._cursorAngle = null;
        window._cursorRadius = null;

        window._trackCursor = function(e) {
            const x = e.clientX - cx;
            const y = -(e.clientY - cy);
            window._cursorRadius = Math.sqrt(x*x + y*y);
            window._cursorAngle = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        };

        canvas.addEventListener('mousemove', window._trackCursor);
    },

    on_finish: function(data) {
        console.log(data);

        const canvas = document.querySelector('canvas');
        if (canvas && window._trackCursor) {
            canvas.removeEventListener('mousemove', window._trackCursor);
        }

        // angle of the last cursor position before the trial ended
        data.cursor_angle = window._cursorAngle;
        data.cursor_radius = window._cursorRadius;

        if (data.click_x !== null && data.click_x !== undefined) {
            const x = data.click_x - data.center_x;
            const y = -(data.click_y - data.center_y);

            data.click_angle = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
            data.click_radius = Math.sqrt(x*x + y*y);

            const theta = jsPsych.evaluateTimelineVariable('theta');
            if (theta != null) {
                let err = data.click_angle - theta;
                data.click_error = ((err + 180) % 360 + 360) % 360 - 180;
            }
        }

        console.log(data.click_angle, data.click_error);
    }
};

    const iti = {
        type: jsPsychPsychophysics,
        stimuli: [{
            obj_type: 'rect',
            width: window.innerWidth,
            height: window.innerHeight,
            fill_color: 'rgb(128, 128, 128)',
            show_start_time: 0
        }],
        choices: "NO_KEYS",
        trial_duration: 300
    };

    const trialFlow = {
        timeline: [study, test, iti],
        timeline_variables: commands,
        repetitions: 2
    };
    timeline.push(trialFlow);

    await jsPsych.run(timeline);
  }

  runExperiment();

  </script>
  </body>
</html>
