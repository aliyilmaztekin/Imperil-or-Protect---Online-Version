    <style>
      /* The psychophysics plugin sets canvas.style.width/height itself.
         Forcing 100vw/100vh here decouples layout size from drawing size and
         makes pointer coordinates disagree with drawn coordinates. */

      html, body { height: 100%; overflow: hidden; margin: 0; }
      #loadscreen {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 12px;

        background: rgb(128,128,128); color: #fff; z-index: 9999;
      }
      #loadscreen.hidden { display: none; }

  <body>
  <div id="loadscreen"><span id="loadtext">Starting&hellip;</span><div id="loadbar"><div></div></div></div>
  <script>
'use strict';

// CONFIG:

// Study images
const SRC_ROOT = 'https://aliyilmaztekin.github.io/Imperil-or-Protect---Online-Version/colorWheelTools/TestObjectsTransparent/';
const SRC_EXT  = '.png';

// The condition matrix determines the events. ImageMatrix determines the image names. 
const CONDITION_URL = 'https://aliyilmaztekin.github.io/Imperil-or-Protect---Online-Version/condFiles/conditionMatrix1.json';
const IMAGE_URL     = 'https://aliyilmaztekin.github.io/Imperil-or-Protect---Online-Version/condFiles/imageMatrix1.json';

// Which conditionMatrix column holds the probe (0-based).
// Row layout: rep, context, rep1color, rep2color, novel, theta, probe, pos...
const probeCol = 6; 
const thetaCol = 5;

const BLOCK_SIZE = 60;
const nCols = 3;
const LAB_CACHE  = 12;            // LabStim objects kept resident (~4 MB each)

// Scale the original size of the image
const imageScale = 0.5;

// Color wheel circle 
const CIRCLE_R      = 215;
const CIRCLE_LINE_W = 3;
const CIRCLE_COLOR  = 'rgb(0,0,0)';
const WHEEL_MARKER  = true;        // short tick showing the current angle
const MARKER_COLOR  = 'rgb(0,0,0)';
const MARKER_LEN    = 12;          // half-length of the tick, in canvas px

// Cursor angle -> theta.  theta = mod(WHEEL_DIR * screenAngle + WHEEL_OFFSET)
const WHEEL_DIR    = -1;
const WHEEL_OFFSET = 90;

// Where the wheel's colours come from.
//   'stimulus' - the probe's own area-weighted mean L*, chroma and hue,
//                so the ring shows what that object actually becomes.
//   'fixed'    - a constant reference ring, identical on every trial.
const WHEEL_REF = 'stimulus';
const WHEEL_FIXED_L = 70, WHEEL_FIXED_C = 38, WHEEL_FIXED_H = 0;

const REQUIRE_INSIDE_RING = false;
const RING_INNER = 60, RING_OUTER = 400;

// Event durations (in milliseconds)
const STUDY_MS = 1900, STUDY_STIM_MS = 800;
const TEST_MS  = 4300, TEST_STIM_MS  = 4000;
const ITI_MS   = 300;

// Context colors pre-defined here.
const contextColors = ['rgb(165, 127, 151)', 'rgb(135, 174, 116)'];
const greyBackground = 'rgb(128, 128, 128)';

// The first context in the experiment is chosen here on a coin flip
const startContext = Math.round(Math.random());

// Data saving. Leave SAVE_URL empty to skip the server round trip and rely
// on the CSV download at the end.
const SAVE_URL   = '';            // e.g. 'https://your-server.example/save'
const SAVE_BLOCKS = true;         // POST after every block, not just at the end
const DOWNLOAD_CSV_FALLBACK = true;

const params = new URLSearchParams(location.search);
const PARTICIPANT_ID = params.get('PROLIFIC_PID') || params.get('id') || `anon-${Date.now()}`;
const SESSION_ID     = params.get('SESSION_ID') || params.get('session') || '1';

// Conversion functions

// Modulo. There's no mod function in JS. 
const mod = (x, m) => ((x % m) + m) % m;

// theta from a screen angle measured CCW from +x with y pointing up.
const angle2theta = deg => mod(Math.round(WHEEL_DIR * deg + WHEEL_OFFSET), 360);

// Exact inverse, used to paint the wheel so the colour under the cursor is
// the colour on screen. Valid because WHEEL_DIR is +/-1.
const theta2angle = th => mod(WHEEL_DIR * (th  - WHEEL_OFFSET), 360);

// Signed circular difference in degrees, in (-180, 180].
const angDiff = (a, b) => mod(a - b + 180, 360) - 180;

/*
 * jspsych-psychophysics sets  canvas.width = canvas_width * devicePixelRatio
 * and then  ctx.scale(dpr, dpr).  So drawing coordinates are CSS pixels while
 * canvas.width is the backing store, dpr times larger. Using canvas.width / 2
 * as the centre overshoots by exactly dpr and throws everything into the
 * bottom-right corner on HiDPI displays.
 *
 * Read the scale off the context instead of assuming devicePixelRatio, so this
 * stays correct if the plugin ever changes its scaling policy.
 */
function drawingBox(blankCanvas, htmlCTX) {
  const transform = htmlCTX.getTransform();
  const sx = transform.a || 1, sy = transform.d || 1;
  const width = blankCanvas.width / sx, height = blankCanvas.height / sy;
  return { width, height, centerX: width / 2, centerY: height / 2, sx, sy };
}

const loadEl   = document.getElementById('loadscreen');
const loadText = document.getElementById('loadtext');
const loadFill = document.querySelector('#loadbar > div');

function showLoading(text, frac) {
  if (!loadEl) return;
  loadEl.classList.remove('hidden');
  loadText.textContent = text;
  loadFill.style.width = (frac == null ? 0 : Math.round(frac * 100)) + '%';
}
const hideLoading = () => loadEl && loadEl.classList.add('hidden');

// jsonencode in Matlab flattens multi-column matrices into a single column.
// To re-establish the 900x3 structure, reshape the imageMatrix
function reshapeMatrix(matrix, nCols) {
    const nRows = matrix.length / nCols;
    return Array.from({ length: nRows }, (_, r) =>
        Array.from({ length: nCols }, (_, c) => matrix[c * nRows + r])
    );
}

/* ==================================================================== *
 *  SOURCE IMAGES + LAB CACHE                                           *
 * ==================================================================== */

const srcFileFor = new Map();     // id -> filename within SRC_ROOT
const srcBitmaps = new Map();     // id -> ImageData (straight alpha)
const labCache   = new Map();     // id -> LabStim  (insertion-ordered LRU)

function srcUrl(id) {
  return `${SRC_ROOT}/${srcFileFor.get(id) || (id + SRC_EXT)}`;
}

function decodeToImageData(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      // willReadFrequently keeps the readback on the CPU path; srgb stops the
      // browser colour-managing the decode out from under us.
      const ctx = c.getContext('2d', { willReadFrequently: true, colorSpace: 'srgb' });
      ctx.drawImage(img, 0, 0);
      resolve(ctx.getImageData(0, 0, c.width, c.height));
    };
    img.onerror = () => reject(new Error(`Could not load source image: ${url}`));
    img.src = url;
  });
}

// Pre-load all the images in a block
// To be called upon during breaks
async function preloadSources(ids, onProgress, matrix) {
  
  let done = 0;

  const nStimPerBlock = () => {
    const nTrialsPerBlock = matrix.length/nBlock;
    return (nTrialsPerBlock / 6) * 8;
  };

  let next = 0;
  const worker = async () => {
    while (next < ids.length) {
      const id = ids[next++];
      if (!srcBitmaps.has(id)) srcBitmaps.set(id, await decodeToImageData(srcUrl(id)));
      onProgress(++done, ids.length);
    }
  };
  await Promise.all(Array.from({ length: Math.min(nStimPerBlock, ids.length) }, worker));
}

function getLab(id) {
  let st = labCache.get(id);
  if (st) { labCache.delete(id); labCache.set(id, st); return st; }   // refresh LRU

  const data = srcBitmaps.get(id);
  if (!data) throw new Error(`No source bitmap decoded for "${id}"`);
  st = new LabStim(data.data, data.width, data.height);
  labCache.set(id, st);

  while (labCache.size > LAB_CACHE) {
    const oldest = labCache.keys().next().value;
    labCache.delete(oldest);
  }
  return st;
}

// Image rendering function
const fileBank = new WeakMap();

function drawStim(htmlCTX, curStim, centerX, centerY, scale) {

  // Check if the current stimulus has already been drawn before
  let stimFile = fileBank.get(curStim);

  // If it has not been, do it for the first time:
  if (!stimFile) {
    
    const blankCanvas = document.createElement('canvas');
    blankCanvas.width = curStim.width; blankCanvas.height = curStim.height;
    
    // Fill up the stim file with stim properties
    stimFile = { canvas: blankCanvas, htmlCTX: blankCanvas.getContext('2d', { colorSpace: 'srgb' }),
          img: new ImageData(curStim.out, curStim.width, curStim.height), theta: null };
    
          // Add the new stim file to the file bank
    fileBank.set(curStim, stimFile);
  }

  // Draw on the created blank canvas the current stimulus, at the specified x-y coordinates
  const curWidth = curStim.width * scale, curHeight = curStim.height * scale;
  htmlCTX.drawImage(stimFile.canvas, centerX - curWidth / 2, centerY - curHeight / 2, curWidth, curHeight);
}

// Create the black line spanning the color wheel 
function drawWheel(htmlCTX, centerX, centerY, theta) {
  htmlCTX.save();

  htmlCTX.strokeStyle = CIRCLE_COLOR;
  htmlCTX.lineWidth   = CIRCLE_LINE_W;
  htmlCTX.beginPath();
  htmlCTX.arc(centerX, centerY, CIRCLE_R, 0, 2 * Math.PI);
  htmlCTX.stroke();

  if (WHEEL_MARKER && theta != null) {
    const rad = angleFromTheta(theta) * Math.PI / 180;
    const ux = Math.cos(rad), uy = -Math.sin(rad);       // y down on canvas
    htmlCTX.strokeStyle = MARKER_COLOR;
    htmlCTX.lineCap = 'round';
    htmlCTX.beginPath();
    htmlCTX.moveTo(centerX + ux * (CIRCLE_R - MARKER_LEN), centerY + uy * (CIRCLE_R - MARKER_LEN));
    htmlCTX.lineTo(centerX + ux * (CIRCLE_R + MARKER_LEN), centerY + uy * (CIRCLE_R + MARKER_LEN));
    htmlCTX.stroke();
  }

  htmlCTX.restore();
}

// Dynamically track where the mouse is to rotate the color of the probe object

const wheel = { angle: null, radius: null, theta: 0, startTheta: 0, stim: null, detach: null };

function attachTracker() {
  const canvas = document.querySelector('canvas');
  if (!canvas) return;
  const g = drawingBox(canvas, canvas.getContext('2d'));
  const box = canvas.getBoundingClientRect();

  // client px -> drawing units. One uniform factor, not separate x and y:
  // a non-uniform scale would distort the cursor angle and therefore the hue.
  const k = g.w / box.width;
  if (Math.abs(k - g.h / box.height) > 0.01) {
    console.warn('Canvas layout aspect differs from its drawing aspect; ' +
                 'cursor angles will be skewed. Check the canvas CSS.');
  }

  const cx = box.left + box.width / 2, cy = box.top + box.height / 2;

  function onMove(e) {
    const x =  (e.clientX - cx) * k;
    const y = -(e.clientY - cy) * k;
    wheel.radius = Math.hypot(x, y);
    wheel.angle  = mod(Math.atan2(y, x) * 180 / Math.PI, 360);
    if (REQUIRE_INSIDE_RING && (wheel.radius < RING_INNER || wheel.radius > RING_OUTER)) return;
    wheel.theta = thetaFromAngle(wheel.angle);
  }

  canvas.addEventListener('pointermove', onMove);
  wheel.detach = () => canvas.removeEventListener('pointermove', onMove);
}

/* ==================================================================== *
 *  DATA SAVING                                                         *
 * ==================================================================== */

let savedRows = 0;

async function postRows(rows, tag) {
  if (!SAVE_URL || !rows.length) return { ok: false, skipped: true };
  const body = JSON.stringify({
    participant_id: PARTICIPANT_ID, session: SESSION_ID, tag,
    sent_at: new Date().toISOString(), rows
  });
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      const res = await fetch(SAVE_URL, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body, keepalive: body.length < 60000
      });
      if (res.ok) return { ok: true };
      console.warn(`save "${tag}" HTTP ${res.status} (attempt ${attempt + 1})`);
    } catch (e) {
      console.warn(`save "${tag}" failed (attempt ${attempt + 1}):`, e.message);
    }
    await new Promise(r => setTimeout(r, 500 * (attempt + 1)));
  }
  return { ok: false };
}

// Ships only rows not sent yet, so a dropout still leaves everything up to
// the last completed block on the server.
async function saveIncremental(jsPsych, tag) {
  const all = jsPsych.data.get().filter({ trial_part: 'test' }).values();
  const fresh = all.slice(savedRows);
  if (!fresh.length) return;
  const res = await postRows(fresh, tag);
  if (res.ok) savedRows = all.length;
}

function downloadCsv(jsPsych) {
  try {
    const csv = jsPsych.data.get().csv();
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${PARTICIPANT_ID}_s${SESSION_ID}_${Date.now()}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch (e) {
    console.error('CSV download failed:', e);
  }
}

// EXPERIMENT SCRIPT

async function runExperiment() {

  // Save data at the end of the experiment
  const jsPsych = initJsPsych({
    on_finish: async function () {
      showLoading('Saving your data\u2026');
      const res = await postRows(jsPsych.data.get().values(), 'final');
      if (!res.ok && DOWNLOAD_CSV_FALLBACK) downloadCsv(jsPsych);
      showLoading('Done. Thank you \u2014 you may close this window.');
    }
  });

  // Save data at the beginning of each trial
  jsPsych.data.addProperties({
    participant_id: PARTICIPANT_ID,
    session: SESSION_ID,
    start_context: startContext,
    screen_w: window.innerWidth,
    screen_h: window.innerHeight,
    dpr: window.devicePixelRatio || 1,
    ua: navigator.userAgent
  });

  // Fetch conditionMatrix and imageMatrix & await until unpacked. 
  showLoading('Loading condition files\u2026');
  const [conditionMatrix, flatImageMatrix] = await Promise.all([
    fetch(CONDITION_URL).then(r => r.json()),
    fetch(IMAGE_URL).then(r => r.json())
  ]);

  // Unfold the flattened matrix
  const imageMatrix = reshapeMatrix(flatImageMatrix, nCols);

  // Extract the contents of the condition matrix
  const timelineVars = conditionMatrix.map((row, i) => {
    const [rep, context, rep1color, rep2color, novel, theta, probe,
            pos1x, pos1y, pos2x, pos2y, pos3x, pos3y] = row;

    // Also get the stimulus names
    const [rep1, rep2, novelStim] = imageMatrix[i];

    return {
        rep, context, theta, probe,
        colors: [rep1color, rep2color, novel],
        positions: [
        { x: pos1x, y: pos1y },
        { x: pos2x, y: pos2y },
        { x: pos3x, y: pos3y },
        ],
        trialCount: i + 1,
        stimNames: [rep1, rep2, novelStim],
    };
    });


  // Preload all the images in the stimulus pool, show loading progress on screen & await until done
  const allIds = [...new Set(timelineVars.flatMap(v => v.stimNames))];
  showLoading('Loading stimuli\u2026', 0);
  await preloadSources(allIds, (n, total) => {
    showLoading(`Loading stimuli\u2026 ${n}/${total}`, n / total);
  });

  // Chop the entire events list into blocks. 
  const blocks = [];
  for (let i = 0; i < timelineVars.length; i += BLOCK_SIZE) {
    blocks.push(timelineVars.slice(i, i + BLOCK_SIZE));
  }

    console.log(blocks)
  // This is important. We convert the colors of all the images within a given block beforehand for speed.
  // Thus, the rotated variants of each study image is precomputed for the color wheel at the start of each block. 
  function blockPrep(k) {
    return {
      type: jsPsychCallFunction,
      async: true,
      func: function (done) {
        const ids = [...new Set(blocks[k].flatMap(v => v.stimNames))];
        showLoading(`Preparing block ${k + 1} of ${blocks.length}\u2026`, 0);
        let n = 0;
        const step = () => {
          if (n < ids.length) {
            getLab(ids[n++]);
            showLoading(`Preparing block ${k + 1} of ${blocks.length}\u2026`, n / ids.length);
            setTimeout(step, 0);              // yield so the bar actually paints
          } else {
            hideLoading();
            done();
          }
        };
        step();
      }
    };
  }

  function blockSave(k) {
    return {
      type: jsPsychCallFunction,
      async: true,
      func: function (done) {
        done();                                // never block the participant
        if (SAVE_BLOCKS) saveIncremental(jsPsych, `block${k + 1}`).catch(console.warn);
      }
    };
  }

  const study = {
    type: jsPsychPsychophysics,
    canvas_width: window.innerWidth,
    canvas_height: window.innerHeight,
    background_color: greyBackground,          // placeholder
    stimuli: [
        { obj_type: 'rect', width: window.innerWidth, height: window.innerHeight,
        fill_color: greyBackground, show_start_time: 0 },   // placeholder
        { obj_type: 'manual', show_start_time: 0, show_end_time: STUDY_STIM_MS,
        drawFunc: function (s, canvas, ctx) {
            const { centerX, centerY } = drawingBox(canvas, ctx);
            for (let item = 0; item < 3; item++) {
            drawStim(ctx, trialState.stims[item],
                    centerX + trialState.pos[item].x,
                    centerY * trialState.pos[item].y, imageScale);
            }
        }
        }
    ],
    choices: 'NO_KEYS',
    trial_duration: STUDY_MS,

    on_start: function (trial) {
        const { color } = contextState();          // NOW there's a trial context
        curContextColor = color;
        trial.background_color   = color;
        trial.stimuli[0].fill_color = color;

        trialState.stims = jsPsych.evaluateTimelineVariable('stimNames').map(getLab);
        trialState.pos   = jsPsych.evaluateTimelineVariable('positions');
    },

    on_finish: function (data) { data.context_color = curContextColor; }
};



  // Testing stage
  const test = {
    type: jsPsychPsychophysics,
    canvas_width: window.innerWidth,
    canvas_height: window.innerHeight,
    background_color: greyBackground,
    stimuli: [
      { obj_type: 'rect', width: window.innerWidth, height: window.innerHeight,
        fill_color: greyBackground, show_start_time: 0 },   // placeholder,
      {
        obj_type: 'manual',
        show_start_time: 0,
        show_end_time: TEST_STIM_MS, // Maximum allowed test duration
        
        drawFunc: function (s, canvas, ctx) {
          const { cx, cy } = drawingBox(canvas, ctx);

          // Black circle drawn at current random rotation increment (wheel.theta)
          drawWheel(ctx, cx, cy, wheel.theta);

          if (wheel.stim) drawStim(ctx, wheel.stim, wheel.theta, cx, cy, imageScale);
        }
      }
    ],
    response_type: 'mouse', // Allow a mouse click to end testing
    response_start_time: 0,
    trial_duration: TEST_MS,

    on_start: function () {
      const allItems = jsPsych.evaluateTimelineVariable('stimNames');
      const probeStimIndex = jsPsych.evaluateTimelineVariable('probe');
      const probeStimName = allItems[number(probeStimIndex-1)]; 

      console.log(probeStimName)

      wheel.stim       = getLab(probeStimName);
      wheel.startTheta = THETA_MIN + Math.floor(Math.random() * N_THETA);
      wheel.theta      = wheel.startTheta;
      wheel.angle      = null;
      wheel.radius     = null;
    },

    on_load: function () { attachTracker(); },

    on_finish: function (data) {
      if (wheel.detach) { wheel.detach(); wheel.detach = null; }

      data.trial_part    = 'test';
      data.probe_stim    = jsPsych.evaluateTimelineVariable('probeStimId');
      data.probe_slot    = jsPsych.evaluateTimelineVariable('probeSlot');
      data.probe_raw     = jsPsych.evaluateTimelineVariable('probe');
      data.probe_resolved = jsPsych.evaluateTimelineVariable('probeResolved');
      data.rep           = jsPsych.evaluateTimelineVariable('rep');
      data.context       = jsPsych.evaluateTimelineVariable('context');

      data.start_hue    = wheel.startTheta;
      data.response_hue = wheel.theta;
      data.target_hue   = Number(jsPsych.evaluateTimelineVariable('targetTheta'));
      data.hue_error    = circDiff(data.response_hue, data.target_hue);

      data.cursor_angle  = wheel.angle;
      data.cursor_radius = wheel.radius;
      data.responded     = wheel.angle !== null;

      const ref = trialState.wheelRef;
      if (ref) { data.wheel_L = ref.L; data.wheel_C = ref.C; data.wheel_h0 = ref.h; }

      if (data.click_x !== null && data.click_x !== undefined) {
        const x =  data.click_x - data.center_x;
        const y = -(data.click_y - data.center_y);
        data.click_angle  = mod(Math.atan2(y, x) * 180 / Math.PI, 360);
        data.click_radius = Math.hypot(x, y);
        const th = jsPsych.evaluateTimelineVariable('theta');
        if (th != null) data.click_error = circDiff(data.click_angle, Number(th));
      }
    }
  };

  // Inter-Trial Interval
  const iti = {
    type: jsPsychPsychophysics,
    canvas_width: window.innerWidth,
    canvas_height: window.innerHeight,
    background_color: greyBackground,
    stimuli: [{
      obj_type: 'rect', width: window.innerWidth, height: window.innerHeight,
      fill_color: greyBackground, show_start_time: 0
    }],
    choices: 'NO_KEYS',
    trial_duration: ITI_MS,
    data: { trial_part: 'iti' }
  };

  /* ---- timeline ---- */

  const timeline = [];

  // Ask the person to switch to fullscreen
  timeline.push({
    type: jsPsychFullscreen,
    fullscreen_mode: true,
    message: '<p style="font-family:sans-serif">The experiment will switch to full screen.</p>',
    button_label: 'Begin'
  });

  // Experiment intructions
  timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `<div style="font-family:sans-serif;max-width:640px;margin:auto;text-align:left">
      <h2>Instructions</h2>
      <p>On each trial you will briefly see three objects. Try to remember the
         colour of each one.</p>
      <p>Then one object will reappear in the centre of a colour ring. Move the
         mouse around the ring to change its colour, and <b>click</b> when it
         matches the colour you saw.</p>
      <p>Press any key to start.</p></div>`,
    on_finish: () => hideLoading()
  });

  // Schedule block-wide events:
  // 1) Prepare the stimuli. 
  // 2) Play out the actual trials. 
  // 3) Save this block's data.
  blocks.forEach((vars, k) => {
    timeline.push(blockPrep(k));
    timeline.push({ timeline: [study, test, iti], timeline_variables: vars });
    timeline.push(blockSave(k));
  });

  timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `<div style="font-family:sans-serif;text-align:center">
      <h2>Finished</h2><p>Press any key to save your data.</p></div>`,
    choices: 'ALL_KEYS'
  });

  hideLoading();
  await jsPsych.run(timeline);
}

runExperiment().catch(err => {
  console.error(err);
  showLoading('Setup failed: ' + err.message);
});

  </script>
