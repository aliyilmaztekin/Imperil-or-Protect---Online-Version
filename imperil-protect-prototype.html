  <script>

/* ==================================================================== *
 *  CONFIG                                                              *
 * ==================================================================== */

const IMG_ROOT = 'studyObjectsRotatedVars';

// Stim IDs are the ORIGINAL file basenames (strings), e.g. "obj305-resized".
//
// How a stim's folder is named. Set to null if every png sits directly
// inside IMG_ROOT with no per-stim subfolder.
//   id -> `stim${id}`  gives  studyObjectsRotatedVars/stimobj305-resized/...
// If your folders are numeric (stim305/) use the second form instead.
const DIR_FOR = id => `stim${id}`;
// const DIR_FOR = id => `stim${(String(id).match(/\d+/) || [id])[0]}`;
// const DIR_FOR = null;

// Degree numbering in the filenames. Verified/overridden at runtime from
// imageMatrix: if a deg 0 turns up, HUE_MIN drops to 0 automatically.
let HUE_MIN = 1;
let N_HUES  = 359;

// All set by inferNaming() from the real filenames - do not hand-edit.
let IMG_EXT = '.png';
let DEG_PAD = 3;
let PRE_SEP = '_';    // between "stim" and the id
let ID_SEP  = '_';    // between the id and "deg"
let DEG_SEP = '';     // between "deg" and the digits

// Which conditionMatrix column holds the probe (0-based).
// Row layout: rep, context, rep1color, rep2color, novel, theta, probe, ...
const PROBE_COL = 6;

// 'auto' | 'id' | 'slot'.  See inferProbeMode().
const PROBE_MODE = 'auto';

const BLOCK_SIZE  = 6;
const PREFETCH    = 1;
const CONCURRENCY = 12;
const COARSE_STEP = 1;

const PROBE_SCALE = 0.5;
const STUDY_SCALE = 0.5;

const WHEEL_DIR    = -1;
const WHEEL_OFFSET = 90;

const REQUIRE_INSIDE_RING = false;
const RING_INNER = 60;
const RING_OUTER = 400;

const contextColors = ['rgb(165, 127, 151)', 'rgb(135, 174, 116)'];
const startContext  = Math.round(Math.random());


/* ==================================================================== *
 *  STIMULUS NAMING                                                     *
 *                                                                      *
 *  Real filenames look like:                                           *
 *      stim_obj305-resized_deg078.png                                  *
 *  i.e.  "stim" PRE_SEP <id> ID_SEP "deg" DEG_SEP <angle> <ext>        *
 *                                                                      *
 *  Note DEG_SEP is EMPTY here - there is no underscore before the      *
 *  digits. The separators are captured rather than assumed, so         *
 *  pathFor() rebuilds exactly the form it parsed.                      *
 *                                                                      *
 *  <id> is an opaque string ("obj305-resized"): letters, digits, '_'   *
 *  and '-', and it may itself contain "deg". Never coerce to Number.   *
 * ==================================================================== */

// ID_SEP is mandatory ([_-], not [_-]?) so the greedy (.+) cannot swallow
// it and leave a trailing underscore on the id. Greedy also means the
// pattern binds to the LAST "deg", so an id like "degas-04" survives.
const NAME_RE_NEW = /^stim([_-]?)(.+)([_-])deg([_-]?)(\d{1,3})\.(png|jpe?g)$/i;

// Legacy, purely numeric ids: stim305deg78.png, stim_024_deg_038.png
const NAME_RE_OLD = /^stim([_-]?)(\d+)([_-]?)deg([_-]?)(\d+)\.(png|jpe?g)$/i;

let STIM_IDS    = [];            // ordered unique ids (strings)
let STIM_ID_SET = new Set();

const padDeg = n => String(n).padStart(DEG_PAD, '0');

function parseStimName(filename) {
  const s = String(filename).trim().replace(/^.*[\\/]/, '');   // strip any path
  const m = NAME_RE_NEW.exec(s) || NAME_RE_OLD.exec(s);
  if (!m) return null;
  return {
    preSep:     m[1],
    id:         m[2],                  // STRING, e.g. "obj305-resized"
    idSep:      m[3],
    degSep:     m[4],
    angle:      parseInt(m[5], 10),    // 0-359
    angleToken: m[5],                  // raw, to detect zero-padding
    ext:        '.' + m[6].toLowerCase(),
  };
}

// First run of digits inside an id: "obj305-resized" -> 305. Used only to
// reconcile a numeric probe column against string ids.
function idDigits(id) {
  const m = String(id).match(/\d+/);
  return m ? Number(m[0]) : null;
}

function inferNaming(names) {
  const ids = new Set();
  let degPad = 3, minDeg = Infinity, maxDeg = -Infinity;
  let ext = null, preSep = null, idSep = null, degSep = null;

  // Frequency count per degree value, so a single stray entry (bad export
  // data) can be told apart from a real, consistent alternate range.
  const degCounts = new Map();
  const firstNameForDeg = new Map();

  const fixed = (cur, val, label, name) => {
    if (cur === null) return val;
    if (cur !== val) {
      throw new Error(`Inconsistent ${label} ("${cur}" vs "${val}") at "${name}". ` +
                      `All filenames must share one naming convention.`);
    }
    return cur;
  };

  for (const name of names) {
    const p = parseStimName(name);
    if (!p) throw new Error(`Unparseable image name: "${name}"`);

    ids.add(p.id);

    // A token shorter than 3 chars proves the field is not padded to 3.
    if (p.angleToken.length < 3) degPad = 0;

    if (p.angle < minDeg) minDeg = p.angle;
    if (p.angle > maxDeg) maxDeg = p.angle;
    degCounts.set(p.angle, (degCounts.get(p.angle) || 0) + 1);
    if (!firstNameForDeg.has(p.angle)) firstNameForDeg.set(p.angle, name);

    ext    = fixed(ext,    p.ext,    'extension',       name);
    preSep = fixed(preSep, p.preSep, 'stim separator',  name);
    idSep  = fixed(idSep,  p.idSep,  'id separator',    name);
    degSep = fixed(degSep, p.degSep, 'deg separator',   name);
  }

  if (ids.size === 0) throw new Error('inferNaming: no images supplied');

  // Natural sort: "obj9" before "obj10".
  const collator = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });
  STIM_IDS    = [...ids].sort(collator.compare);
  STIM_ID_SET = new Set(STIM_IDS);

  DEG_PAD = degPad;
  IMG_EXT = ext;
  PRE_SEP = preSep;
  ID_SEP  = idSep;
  DEG_SEP = degSep;

  // HUE_MIN is NOT auto-adjusted from a bare min() anymore: a single stray
  // out-of-range entry (e.g. one bad "deg_0" reference in an otherwise
  // 1-359 dataset) used to silently drag the global floor down for every
  // stimulus, which then made every probe request a frame that was never
  // rendered. Flag anomalies loudly instead, naming an offending file so
  // the bad entry is traceable back to whatever generated it.
  const total = names.length;
  const belowFloor = [...degCounts.entries()].filter(([d]) => d < HUE_MIN);
  const nBelow = belowFloor.reduce((s, [, c]) => s + c, 0);

  if (nBelow > 0) {
    const pct = ((nBelow / total) * 100).toFixed(1);
    const examples = belowFloor.slice(0, 5)
      .map(([d]) => `deg ${d} (e.g. "${firstNameForDeg.get(d)}")`)
      .join(', ');
    throw new Error(
      `${nBelow}/${total} imageMatrix entries (${pct}%) reference a degree ` +
      `below HUE_MIN=${HUE_MIN}: ${examples}. These frames were never ` +
      `rendered (your sweep is ${HUE_MIN}-${HUE_MIN + N_HUES - 1}), so ` +
      `this is bad data upstream - not something this script should ` +
      `paper over by silently changing HUE_MIN. Trace these filenames ` +
      `back to whatever built imageMatrix/conditionMatrix.`
    );
  }

  const span = maxDeg - HUE_MIN + 1;
  if (span > N_HUES) {
    console.warn(`Observed degrees run to ${maxDeg}; raising N_HUES ${N_HUES} -> ${span}`);
    N_HUES = span;
  }

  const first = parseStimName(names[0]);
  const rebuilt = pathFor(first.id, first.angle - HUE_MIN);
  console.log('naming inferred:', {
    pattern: `stim${PRE_SEP}<id>${ID_SEP}deg${DEG_SEP}<deg>${IMG_EXT}`,
    degPad: DEG_PAD, degRange: [minDeg, maxDeg], HUE_MIN, N_HUES,
    nStim: STIM_IDS.length, ids: STIM_IDS.slice(0, 5),
    example: rebuilt,
  });

  // Round-trip check: the rebuilt filename must equal the observed one.
  const observed = String(names[0]).replace(/^.*[\\/]/, '');
  if (!rebuilt.endsWith(observed)) {
    console.warn(`pathFor rebuilds "${rebuilt.split('/').pop()}" but the ` +
                 `manifest says "${observed}". Every image request will 404.`);
  }
}

// i is a 0-based hue index; the filename carries i + HUE_MIN.
function pathFor(stimId, i) {
  const id = String(stimId);
  if (!STIM_ID_SET.has(id)) {
    throw new Error(`pathFor: unknown stim id "${stimId}"`);
  }
  if (!Number.isInteger(i) || i < 0 || i >= N_HUES) {
    throw new Error(`pathFor: bad hue index ${i} for stim "${id}"`);
  }
  const file = `stim${PRE_SEP}${id}${ID_SEP}deg${DEG_SEP}${padDeg(i + HUE_MIN)}${IMG_EXT}`;
  const dir  = DIR_FOR ? DIR_FOR(id) + '/' : '';
  return `${IMG_ROOT}/${dir}${file}`;
}

function parseName(name) {
  const p = parseStimName(name);
  if (!p) throw new Error(`Unparseable image name: "${name}"`);
  const hueIndex = p.angle - HUE_MIN;
  if (hueIndex < 0 || hueIndex >= N_HUES) {
    throw new Error(`Degree ${p.angleToken} out of range in "${name}"`);
  }
  return { stimId: p.id, hueIndex };   // stimId is a STRING
}


/* ==================================================================== *
 *  PROBE COLUMN INTERPRETATION                                         *
 *                                                                      *
 *  conditionMatrix column 7 is numeric, but stim ids are strings like  *
 *  "obj305-resized". The column could mean either:                     *
 *    'id'   - a stim number, to be matched against that trial's images *
 *    'slot' - a 1-based index into that trial's 3 images               *
 *  Score both against the data and take the winner, the same way       *
 *  normalizeImageMatrix resolves the reshape.                          *
 * ==================================================================== */

function matchIdToken(raw, ids) {
  const s = String(raw).trim();

  // 1. exact string match
  if (ids.includes(s)) return s;

  if (/^\d+$/.test(s)) {
    const n = Number(s);

    // 2. whole id is numeric, tolerant of zero-padding ("24" vs "024")
    const whole = ids.find(id => /^\d+$/.test(id) && Number(id) === n);
    if (whole) return whole;

    // 3. digit run inside the id ("305" matches "obj305-resized").
    //    Only accept if exactly one of the trial's ids matches, otherwise
    //    it is ambiguous and we would be guessing.
    const hits = ids.filter(id => idDigits(id) === n);
    if (hits.length === 1) return hits[0];
  }
  return null;
}

function inferProbeMode(conditionMatrix, imageMatrix) {
  const n = conditionMatrix.length;
  let idHits = 0, slotHits = 0;

  for (let i = 0; i < n; i++) {
    const ids = imageMatrix[i].map(f => parseStimName(f).id);
    const raw = String(conditionMatrix[i][PROBE_COL]).trim();

    if (matchIdToken(raw, ids)) idHits++;
    if (/^\d+$/.test(raw)) {
      const v = Number(raw);
      if (Number.isInteger(v) && v >= 1 && v <= ids.length) slotHits++;
    }
  }

  const pctId = idHits / n, pctSlot = slotHits / n;
  console.log(`probe column: id-match ${(pctId * 100).toFixed(0)}%, ` +
              `slot-index ${(pctSlot * 100).toFixed(0)}% of trials`);

  if (PROBE_MODE !== 'auto') {
    console.log(`probe mode forced to "${PROBE_MODE}"`);
    return PROBE_MODE;
  }

  if (pctId >= 0.99) {
    if (pctSlot >= 0.99) {
      console.warn('Probe column is ambiguous: every value is both a valid ' +
                   'stim id AND a valid 1-3 slot index. Assuming "id". ' +
                   'Set PROBE_MODE explicitly if that is wrong.');
    }
    return 'id';
  }
  if (pctSlot >= 0.99) return 'slot';

  throw new Error(
    `Cannot interpret conditionMatrix column ${PROBE_COL + 1}: it matches a ` +
    `stim id on ${(pctId * 100).toFixed(0)}% of trials and a 1-3 slot index ` +
    `on ${(pctSlot * 100).toFixed(0)}%. Neither is consistent. Check the ` +
    `column index, or set PROBE_MODE manually.`);
}


/* ==================================================================== *
 *  MATLAB CELL RESHAPE                                                 *
 *                                                                      *
 *  jsonencode flattens a cell array column-major, so a 900x3 cell      *
 *  arrives as 2700 loose strings. Numeric matrices keep their rows,    *
 *  which is why conditionMatrix looks fine and this one does not.      *
 * ==================================================================== */

function normalizeImageMatrix(raw, nTrials) {
  if (!Array.isArray(raw)) raw = Object.values(raw);

  // Already nested (one array per trial) - nothing to do.
  if (Array.isArray(raw[0])) {
    if (raw.length !== nTrials) {
      throw new Error(`imageMatrix has ${raw.length} rows, conditionMatrix has ${nTrials}`);
    }
    console.log('imageMatrix: already nested, used as-is');
    return raw.map(r => r.slice(0, 3));
  }

  if (raw.length !== 3 * nTrials) {
    throw new Error(
      `imageMatrix has ${raw.length} entries; expected ${3 * nTrials} ` +
      `(3 x ${nTrials} trials) or ${nTrials} nested rows.`
    );
  }

  const colMajor = Array.from({ length: nTrials }, (_, i) =>
    [raw[i], raw[i + nTrials], raw[i + 2 * nTrials]]);
  const rowMajor = Array.from({ length: nTrials }, (_, i) =>
    [raw[3 * i], raw[3 * i + 1], raw[3 * i + 2]]);

  // The repeated items hold still across a mini-block; the novel item does
  // not. Whichever reshape reproduces that is the right one.
  const score = m => {
    let hits = 0, total = 0;
    for (let b = 0; b + BLOCK_SIZE <= m.length; b += BLOCK_SIZE) {
      total++;
      const head = m[b];
      const held = m.slice(b, b + BLOCK_SIZE)
                    .every(r => r[0] === head[0] && r[1] === head[1]);
      const moves = new Set(m.slice(b, b + BLOCK_SIZE).map(r => r[2])).size > 1;
      if (held && moves) hits++;
    }
    return total ? hits / total : 0;
  };

  const sCol = score(colMajor), sRow = score(rowMajor);
  console.log(`imageMatrix reshape: column-major ${(sCol * 100).toFixed(0)}%, ` +
              `row-major ${(sRow * 100).toFixed(0)}% of blocks consistent`);

  if (Math.max(sCol, sRow) < 0.9) {
    console.warn('Neither reshape matches the expected 2-repeats + 1-novel ' +
                 'block structure. Check BLOCK_SIZE and the export.');
  }
  return sCol >= sRow ? colMajor : rowMajor;
}

/* ==================================================================== *
 *  IMAGE CACHE                                                         *
 * ==================================================================== */

const imgCache = new Map();   // url -> Image (null if it 404'd)
const pending  = new Map();   // url -> Promise, dedupes in-flight requests

function loadUrl(url) {
  if (imgCache.has(url)) return Promise.resolve(imgCache.get(url));
  if (pending.has(url))  return pending.get(url);

  const p = new Promise(resolve => {
    const img = new Image();
    img.onload  = () => { imgCache.set(url, img);  pending.delete(url); resolve(img); };
    img.onerror = () => {
      console.warn('Missing image:', url);
      imgCache.set(url, null); pending.delete(url); resolve(null);
    };
    img.src = url;
  });

  pending.set(url, p);
  return p;
}

async function loadUrls(urls, onProgress) {
  const todo = urls.filter(u => !imgCache.has(u));
  if (!todo.length) return;

  let next = 0, done = 0;
  const worker = async () => {
    while (next < todo.length) {
      await loadUrl(todo[next++]);
      if (onProgress) onProgress(++done, todo.length);
    }
  };
  await Promise.all(Array.from({ length: Math.min(CONCURRENCY, todo.length) }, worker));
}

function evictExcept(keepSet) {
  let freed = 0;
  for (const [url, img] of imgCache) {
    if (keepSet.has(url) || pending.has(url)) continue;
    if (img) img.src = '';   // makes the decoded bitmap collectable
    imgCache.delete(url);
    freed++;
  }
  if (freed) console.log(`evicted ${freed} frames; ${imgCache.size} resident`);
}

const getImg = url => imgCache.get(url) || null;

function wheelImg(stimId, i) {
  const span = Math.max(1, COARSE_STEP);
  for (let d = 0; d <= span; d++) {
    for (const j of (d === 0 ? [i] : [i - d, i + d])) {
      const k = ((j % N_HUES) + N_HUES) % N_HUES;
      const img = getImg(pathFor(stimId, k));
      if (img) return { img, index: k };
    }
  }
  return null;
}

/* ==================================================================== *
 *  CURSOR STATE                                                        *
 * ==================================================================== */

const wheel = {
  angle: null, radius: null,
  index: 0, startIndex: 0, shownIndex: 0,
  probeId: null, detach: null       // probeId is a STRING
};

const studyState = { urls: [null, null, null] };

const angleToHue = deg =>
  ((Math.round(WHEEL_DIR * deg + WHEEL_OFFSET) % N_HUES) + N_HUES) % N_HUES;

function attachTracker() {
  const canvas = document.querySelector('canvas');
  if (!canvas) return;
  const box = canvas.getBoundingClientRect();
  const sx = canvas.width / box.width, sy = canvas.height / box.height;
  const cx = box.left + box.width / 2, cy = box.top + box.height / 2;

  function onMove(e) {
    const x =  (e.clientX - cx) * sx;
    const y = -(e.clientY - cy) * sy;
    wheel.radius = Math.hypot(x, y);
    wheel.angle  = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    if (REQUIRE_INSIDE_RING &&
        (wheel.radius < RING_INNER || wheel.radius > RING_OUTER)) return;
    wheel.index = angleToHue(wheel.angle);
  }

  canvas.addEventListener('pointermove', onMove);
  wheel.detach = () => canvas.removeEventListener('pointermove', onMove);
}

/* ==================================================================== *
 *  LOADING OVERLAY                                                     *
 * ==================================================================== */

const loadEl = document.getElementById('loadscreen');
const showLoading = text => {
  if (!loadEl) return;
  loadEl.classList.remove('hidden');
  loadEl.textContent = text;
};
const hideLoading = () => loadEl && loadEl.classList.add('hidden');

/* ==================================================================== *
 *  EXPERIMENT                                                          *
 * ==================================================================== */

async function runExperiment() {

  showLoading('Loading condition files\u2026');

  const [conditionMatrix, rawImageMatrix] = await Promise.all([
    fetch('conditionMatrix1.json').then(r => r.json()),
    fetch('imageMatrix1.json').then(r => r.json())
  ]);

  const nTrials = conditionMatrix.length;
  const imageMatrix = normalizeImageMatrix(rawImageMatrix, nTrials);

  inferNaming(imageMatrix.flat());

  // ---- sanity probe: does the FIRST reconstructed path actually exist? ----
  // Confirms DIR_FOR's guessed folder layout against the real server before
  // spending minutes prefetching 359 frames that will all 404 the same way.
  {
    const firstParsed = parseName(imageMatrix.flat()[0]);
    const probeUrl = pathFor(firstParsed.stimId, firstParsed.hueIndex);
    const res = await fetch(probeUrl, { method: 'HEAD' }).catch(e => ({ ok: false, status: `network error: ${e.message}` }));
    if (!res.ok) {
      const flatUrl = `${IMG_ROOT}/${probeUrl.split('/').pop()}`;
      throw new Error(
        `First image did not load (status ${res.status}): ${probeUrl}\n` +
        `This is a folder-layout mismatch, not a filename problem - the ` +
        `filename itself was verified against imageMatrix.json.\n` +
        `Check: (1) does that exact path exist on your server? ` +
        `(2) is DIR_FOR guessing the right subfolder - try DIR_FOR = null ` +
        `for a flat layout (${flatUrl}), or adjust the template. ` +
        `(3) filesystem case-sensitivity, if on Linux/deployed hosting.`
      );
    }
  }

  const probeMode = inferProbeMode(conditionMatrix, imageMatrix);

  /* ---- timeline variables ---- */

  let unmatchedProbes = 0;

  const timelineVars = conditionMatrix.map((row, i) => {
    const [rep, context, rep1color, rep2color, novel, theta, probe,
           pos1x, pos1y, pos2x, pos2y, pos3x, pos3y] = row;

    const names  = imageMatrix[i];
    const parsed = names.map(parseName);
    const ids    = parsed.map(p => p.stimId);

    // Resolve the probe to one of THIS trial's three stim ids (a string).
    let probeStimId = null;
    if (probeMode === 'slot') {
      const v = Number(probe);
      if (Number.isInteger(v) && v >= 1 && v <= ids.length) probeStimId = ids[v - 1];
    } else {
      probeStimId = matchIdToken(probe, ids);
    }

    if (probeStimId === null) {
      unmatchedProbes++;
      probeStimId = ids[0];             // keeps the trial renderable
    }

    // Score against the studied hue of whichever item is probed.
    const hit = parsed.find(p => p.stimId === probeStimId);
    const HUE_KEY = { 1: 'rep1color', 2: 'rep2color', 3: 'novel' };
    const key = HUE_KEY[probeStimId];
    const targetHue = key === undefined
      ? null
      : Number(jsPsych.evaluateTimelineVariable(key));

    return {
      rep, context, rep1color, rep2color, novel, theta,
      probe, probeStimId, targetHue,
      pos1x, pos1y, pos2x, pos2y, pos3x, pos3y,
      url1: pathFor(parsed[0].stimId, parsed[0].hueIndex),
      url2: pathFor(parsed[1].stimId, parsed[1].hueIndex),
      url3: pathFor(parsed[2].stimId, parsed[2].hueIndex)
    };
  });

  if (unmatchedProbes) {
    console.warn(`${unmatchedProbes}/${nTrials} trials: the probe value in ` +
                 `conditionMatrix column ${PROBE_COL + 1} could not be resolved ` +
                 `to one of that trial's three images (mode "${probeMode}"). ` +
                 `Those trials fell back to the first image and their ` +
                 `hue_error is NOT trustworthy.`);
  }

  /* ---- blocks ---- */

  const blocks = [];
  for (let i = 0; i < timelineVars.length; i += BLOCK_SIZE) {
    blocks.push(timelineVars.slice(i, i + BLOCK_SIZE));
  }

  const blockStudyUrls = blocks.map(vars => {
    const s = new Set();
    for (const v of vars) { s.add(v.url1); s.add(v.url2); s.add(v.url3); }
    return [...s];
  });

  const blockWheelUrls = blocks.map(vars => {
    const ids = [...new Set(vars.map(v => v.probeStimId))];
    const coarse = [], fine = [];
    for (const id of ids) {
      for (let i = 0; i < N_HUES; i++) {
        (i % COARSE_STEP === 0 ? coarse : fine).push(pathFor(id, i));
      }
    }
    return { coarse, fine, all: coarse.concat(fine) };
  });

  const blockAllUrls = blocks.map((_, k) =>
    blockStudyUrls[k].concat(blockWheelUrls[k].all));

  console.log(`${nTrials} trials in ${blocks.length} blocks; block 0 needs ` +
              `${blockAllUrls[0].length} frames ` +
              `(${blockWheelUrls[0].coarse.length} before it can start)`);

  function blockLoader(k) {
    return {
      type: jsPsychCallFunction,
      async: true,
      func: async function(done) {
        const need = blockStudyUrls[k].concat(blockWheelUrls[k].coarse)
                       .filter(u => !imgCache.has(u)).length;
        if (need) showLoading(`Loading block ${k + 1} of ${blocks.length}\u2026 0/${need}`);

        await loadUrls(blockStudyUrls[k]);
        await loadUrls(blockWheelUrls[k].coarse, (n, total) => {
          showLoading(`Loading block ${k + 1} of ${blocks.length}\u2026 ${n}/${total}`);
        });

        hideLoading();
        done();                        // block starts here

        const keep = new Set();
        for (let j = k; j <= k + PREFETCH && j < blocks.length; j++) {
          blockAllUrls[j].forEach(u => keep.add(u));
        }
        evictExcept(keep);

        if (COARSE_STEP > 1) loadUrls(blockWheelUrls[k].fine).catch(console.warn);
        for (let j = k + 1; j <= k + PREFETCH && j < blocks.length; j++) {
          loadUrls(blockStudyUrls[j]).catch(console.warn);
          loadUrls(blockWheelUrls[j].coarse).catch(console.warn);
        }
      }
    };
  }

  /* ---- trials ---- */

  const jsPsych = initJsPsych();
  const timeline = [];

  const ctxColor = () => {
    const raw = jsPsych.evaluateTimelineVariable('context');
    const idx = (raw === null || raw === undefined || raw === '')
      ? startContext : Number(raw);
    return contextColors[idx] ?? contextColors[0];
  };

  const studyItem = (slot, urlKey, xKey, yKey) => ({
    obj_type: 'image',
    file:   function() { return jsPsych.evaluateTimelineVariable(urlKey); },
    origin_center: true,
    startX: function() { return Number(jsPsych.evaluateTimelineVariable(xKey)); },
    startY: function() { return Number(jsPsych.evaluateTimelineVariable(yKey)); },
    scale: STUDY_SCALE,
    show_start_time: 0,
    show_end_time: 800,
    // Draw the copy we already decoded rather than one the plugin may still
    // be fetching.
    change_attr: function(stim) {
      const url = studyState.urls[slot];
      if (!url) return;
      const img = getImg(url);
      if (img && stim.img !== img) { stim.img = img; stim.file = url; }
    }
  });

  const study = {
    type: jsPsychPsychophysics,
    canvas_width: window.innerWidth,
    canvas_height: window.innerHeight,
    stimuli: [
      { obj_type: 'rect', width: window.innerWidth, height: window.innerHeight,
        fill_color: ctxColor, show_start_time: 0 },
      studyItem(0, 'url1', 'pos1x', 'pos1y'),
      studyItem(1, 'url2', 'pos2x', 'pos2y'),
      studyItem(2, 'url3', 'pos3x', 'pos3y')
    ],
    choices: "NO_KEYS",
    trial_duration: 1900,
    on_start: function() {
      studyState.urls = [
        jsPsych.evaluateTimelineVariable('url1'),
        jsPsych.evaluateTimelineVariable('url2'),
        jsPsych.evaluateTimelineVariable('url3')
      ];
    }
  };

  const test = {
    type: jsPsychPsychophysics,
    canvas_width: window.innerWidth,
    canvas_height: window.innerHeight,
    stimuli: [
      { obj_type: 'rect', width: window.innerWidth, height: window.innerHeight,
        fill_color: ctxColor, show_start_time: 0 },
      { obj_type: 'circle', radius: 200, line_color: 'black',
        show_start_time: 0, show_end_time: 4000 },
      { obj_type: 'image',
        file: function() {
          return pathFor(jsPsych.evaluateTimelineVariable('probeStimId'), 0);
        },
        origin_center: true,
        scale: PROBE_SCALE,
        show_start_time: 0,
        show_end_time: 4000,
        change_attr: function(stim) {
          if (wheel.probeId == null) return;
          const hit = wheelImg(wheel.probeId, wheel.index);
          if (!hit || stim.img === hit.img) return;
          stim.img  = hit.img;
          stim.file = hit.img.src;
          wheel.shownIndex = hit.index;
        }
      }
    ],
    response_type: 'mouse',
    response_start_time: 0,
    trial_duration: 4300,

    on_start: function() {
      wheel.probeId    = jsPsych.evaluateTimelineVariable('probeStimId');
      wheel.startIndex = Math.floor(Math.random() * N_HUES);
      wheel.index      = wheel.startIndex;
      wheel.shownIndex = wheel.startIndex;
      wheel.angle      = null;
      wheel.radius     = null;
    },

    on_load: function() { attachTracker(); },

    on_finish: function(data) {
      if (wheel.detach) { wheel.detach(); wheel.detach = null; }

      data.probe_stim    = wheel.probeId;          // STRING
      data.probe_raw     = jsPsych.evaluateTimelineVariable('probe');
      data.start_hue     = wheel.startIndex;
      data.response_hue  = wheel.index;
      data.displayed_hue = wheel.shownIndex;
      data.cursor_angle  = wheel.angle;
      data.cursor_radius = wheel.radius;


      on_finish: (data) => {
    const targetHue = Number(data[HUE_KEY[probeStimId]]);
    // ...
  }

      const target = jsPsych.evaluateTimelineVariable('targetHue');
      data.target_hue = target;
      if (target != null) {
        const half = N_HUES / 2;
        const err  = data.response_hue - Number(target);
        data.hue_error = ((err + half) % N_HUES + N_HUES) % N_HUES - half;
      }

      if (data.click_x !== null && data.click_x !== undefined) {
        const x =  data.click_x - data.center_x;
        const y = -(data.click_y - data.center_y);
        data.click_angle  = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        data.click_radius = Math.hypot(x, y);

        const th = jsPsych.evaluateTimelineVariable('theta');
        if (th != null) {
          const err = data.click_angle - Number(th);
          data.click_error = ((err + 180) % 360 + 360) % 360 - 180;
        }
      }

      console.log('probe', data.probe_stim, 'start', data.start_hue,
                  'response', data.response_hue, 'target', data.target_hue,
                  'error', data.hue_error);
    }
  };

  const iti = {
    type: jsPsychPsychophysics,
    canvas_width: window.innerWidth,
    canvas_height: window.innerHeight,
    stimuli: [{
      obj_type: 'rect', width: window.innerWidth, height: window.innerHeight,
      fill_color: 'rgb(128, 128, 128)', show_start_time: 0
    }],
    choices: "NO_KEYS",
    trial_duration: 300
  };

  blocks.forEach((vars, k) => {
    timeline.push(blockLoader(k));
    timeline.push({ timeline: [study, test, iti], timeline_variables: vars });
  });

  hideLoading();
  await jsPsych.run(timeline);
}

runExperiment().catch(err => {
  console.error(err);
  showLoading('Setup failed: ' + err.message);
});

  </script>
  </body>
</html>
